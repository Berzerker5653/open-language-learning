# Rust workspace for the local-first language-learning platform.
# Dependency direction rules (docs/07): domain crates must not depend on
# language-pack data or provider implementations.
[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
lts-domain = { path = "crates/domain" }
lts-learner-model = { path = "crates/learner-model" }
lts-scheduler = { path = "crates/scheduler" }
lts-langpack = { path = "crates/langpack" }
lts-storage = { path = "crates/storage" }
lts-speech-api = { path = "crates/speech-api" }
lts-speech-runtime = { path = "crates/speech-runtime" }
lts-audio = { path = "crates/audio" }
lts-security = { path = "crates/security" }
lts-activity = { path = "crates/activity" }
lts-world = { path = "crates/world" }
serde = { version = "1.0.229", features = ["derive"] }
semver = { version = "1.0.28", features = ["serde"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
jsonschema = "0.58.5"
serde_yaml = "0.9.34"
clap = { version = "4.6.7", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.0"
tempfile = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
