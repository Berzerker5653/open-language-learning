name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual only: triggers the untested-platform bundle builds below.
  workflow_dispatch:

# A rapid push batch queues instead of stacking full runs. On 2026-10-05 an
# authoring batch of ~150 one-commit pushes burned the entire private-repo
# Actions allowance (~33 allowance-minutes per run, macOS billed at 10x), which
# blocked CI for the rest of the cycle. Cancelling superseded runs is deliberate:
# the commit that matters on `main` is the newest one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # CI-AUDIO 2026-10-13: the .wav bytes under languages/*/media/ are
      # gitignored (ADR-0016), so a fresh checkout has the manifests without
      # the audio and every test that installs a reference pack fails.
      # Restore the archives published for the versions pinned in
      # catalog/packs.json before cargo test consumes the packs. The cache
      # key changes whenever either pack's pinned version/sha256 changes;
      # the script re-verifies size+sha256 against the catalog before
      # unpacking, so a stale cache hit is refused, never trusted.
      - name: Cache published pack archives
        uses: actions/cache@v4
        with:
          path: tmp/pack-audio
          key: pack-audio-${{ hashFiles('catalog/packs.json') }}
      - name: Restore reference-pack audio (published archives)
        run: |
          ./scripts/fetch-pack-audio.sh --pack-dir languages/ja-JP --work-dir tmp/pack-audio
          ./scripts/fetch-pack-audio.sh --pack-dir languages/ru-RU --work-dir tmp/pack-audio
      # Fast bash gate for the shipped aligner payload (ADR-0019): synthetic
      # payload only, no network/cmake/cargo, seconds to run.
      - name: Aligner sidecar staging script regression test
        run: ./scripts/test-stage-aligner-sidecar.sh
      - name: Pack bundle staging script regression test
        run: ./scripts/test-stage-pack-bundle.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Pack conformance (ja-JP + ru-RU + example template)
        run: |
          cargo run -q -p lts-langpack-cli -- validate languages/ja-JP
          cargo run -q -p lts-langpack-cli -- lint languages/ja-JP
          # install-mode `test` now runs: the restore step put the gitignored
          # .wav bytes in place, so this exercises the same install gate a user
          # hits (ADR-0024 media coverage) on a fresh checkout.
          cargo run -q -p lts-langpack-cli -- test languages/ja-JP
          cargo run -q -p lts-langpack-cli -- audit-curriculum languages/ja-JP
          cargo run -q -p lts-langpack-cli -- audit-lexicon languages/ja-JP
          cargo run -q -p lts-langpack-cli -- audit-licenses languages/ja-JP
          cargo run -q -p lts-langpack-cli -- validate languages/ru-RU
          cargo run -q -p lts-langpack-cli -- lint languages/ru-RU
          # same for ru-RU: audio restored from the published archive, so the
          # install gate is exercised end to end rather than assumed.
          cargo run -q -p lts-langpack-cli -- test languages/ru-RU
          cargo run -q -p lts-langpack-cli -- lint tools/pack-templates/example-pack
      # PACK-AI-001 conformance proofs: a second, non-Japanese language and an
      # RTL/multi-script pack, both scaffolded by scripts/new-pack.py with
      # committed placeholder audio (examples/*/media is NOT gitignored, unlike
      # languages/*/media), so install mode is gated on a fresh checkout with no
      # download and no TTS. They prove authoring needs no engine edits; they
      # prove nothing about teaching quality.
      - name: Pack conformance for the generated proofs (eo-community, ar-ma)
        run: |
          for pack in examples/eo-community examples/ar-ma; do
            cargo run -q -p lts-langpack-cli -- validate          "$pack"
            cargo run -q -p lts-langpack-cli -- lint              "$pack"
            cargo run -q -p lts-langpack-cli -- audit-curriculum  "$pack"
            cargo run -q -p lts-langpack-cli -- audit-lexicon     "$pack"
            cargo run -q -p lts-langpack-cli -- audit-licenses    "$pack"
            cargo run -q -p lts-langpack-cli -- audit-sources     "$pack"
            cargo run -q -p lts-langpack-cli -- test              "$pack"
          done

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  desktop-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      # CI-AUDIO 2026-10-13: the .wav bytes under languages/*/media/ are
      # gitignored (ADR-0016); smoke-desktop.sh builds pack archives and the
      # silent-archive guard (crates/langpack/src/archive.rs) refuses an
      # audio-less pack (ADR-0024). Restore the published archives first.
      - name: Cache published pack archives
        uses: actions/cache@v4
        with:
          path: tmp/pack-audio
          key: pack-audio-${{ hashFiles('catalog/packs.json') }}
      - name: Restore reference-pack audio (published archives)
        run: |
          ./scripts/fetch-pack-audio.sh --pack-dir languages/ja-JP --work-dir tmp/pack-audio
          ./scripts/fetch-pack-audio.sh --pack-dir languages/ru-RU --work-dir tmp/pack-audio
      # 900 s rather than the script's 240 s default: run 38457024075 ran the
      # same walkthrough on a 2-core runner and `timeout 240` killed it (exit
      # 124) before it finished. With 900 s the job passes in about 6 1/2 min
      # (run 38463751108), so the margin is for slow CI hardware, not a slow app.
      - run: ./scripts/smoke-desktop.sh
        env:
          LTS_SMOKE_TIMEOUT: 900

  # PLAT-001 (K-34): Windows/macOS parity is compile-only. Runtime behavior
  # is tested on Linux (desktop-smoke above); Windows/macOS builds are
  # published marked untested so users can report issues (owner decision
  # 2026-10-03). Do not add runtime test steps here without owner scope.
  platform-compile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Compile-check desktop app
        run: cargo check -p lts-desktop --all-targets

  # PLAT-001 / ADR-0015 (owner decision 2026-10-07): builds for untested
  # platforms may exist so people can try them and file runtime reports. This
  # job produces Windows/macOS bundles and uploads them as workflow artifacts
  # whose NAME carries the untested marker. A bundle proves only that it linked:
  # a platform leaves `untested_platforms` only when a human runtime report
  # lands in docs/platform/PLATFORM_REPORTS.yaml (docs/13). Nothing here
  # publishes to a release — that stays owner gate O-05.
  # Manual-only: three-OS bundle builds are too slow for every push.
  # Trigger with `gh workflow run ci.yml`.
  platform-bundles:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Build unsigned bundles (runtime untested)
        working-directory: apps/desktop
        run: pnpm tauri build
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: open-language-learning-${{ matrix.os }}-UNTESTED-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.app/
          if-no-files-found: error
          retention-days: 14

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --redact
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - name: JS dependency audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Rust advisory audit
        run: |
          cargo install cargo-audit --locked
          # Fail closed: any advisory not in the allow-list exits non-zero.
          # Measured on cargo-audit 0.22.2: only `--deny warnings` is accepted;
          # `--deny-warnings` exits 2 as an unknown argument.
          # Allow-list: .cargo/audit.toml, resolved from the repository root
          # (this job's default working directory). Rationale + measurements:
          # state/evidence/SEC-001/cargo-audit-posture.md.
          cargo audit --deny warnings
      - name: SBOM (CycloneDX 1.5, Rust + npm)
        run: |
          python3 -m pip install --quiet PyYAML==6.0.3
          python3 tools/sbom.py --output target/sbom/open-language-learning.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/sbom/
          retention-days: 14

  schemas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/validate_handoff.py --require-explicit-ledger-records
      - run: python -m unittest discover -s tools -p 'test_validate_handoff.py'
      - run: python scripts/test_generate_pack_audio.py
      # CI-AUDIO: hermetic regression test for the restore path the rust and
      # desktop-smoke jobs depend on (synthetic pack + local archive, no
      # network/cargo).
      - run: python scripts/test_fetch_pack_audio.py
      # AUDIO-NORM: loudness conformance for the tracked journey assets. The
      # tool re-applies generate-pack-audio.py's own `normalize_wav` (it never
      # needed sox) and rewrites only the manifest rows its bytes actually
      # changed, so the shipped audio and its notes cannot drift apart.
      - run: python scripts/test_renormalize_pack_audio.py
      # PACK-AI-001: the scaffold's own invariants (media coverage/hash, script
      # declaration, placeholder-audio honesty) without cargo, network or TTS.
      - run: python -m unittest discover -s scripts -p 'test_new_pack.py'
      # R12: counted template repetition in the shipped packs, plus the
      # auditor's own invariants. A count is a review input, not a claim about
      # teaching quality.
      - run: python tools/audit_content_templates.py languages/ja-JP languages/ru-RU
      - run: python -m unittest discover -s tools -p 'test_audit_content_templates.py'
      # I04: the project's own ticket/ADR/gate ids must stay out of sentences
      # the learner reads.
      - run: python tools/audit_learner_copy.py
      - run: python -m unittest discover -s tools -p 'test_audit_learner_copy.py'
