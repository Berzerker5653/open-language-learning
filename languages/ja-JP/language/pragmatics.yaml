# Register labels carried over from the 0.1 pragmatics/registers.yaml.
# These are provisional working labels; no formality numbers are claimed
# until research validates them. Do not reduce Japanese register to a
# binary polite/casual switch; choice depends on situation, relationship,
# and setting.
schema_version: "0.2"

registers:
  - id: ja.register.neutral-common
    name: "Neutral-common (working label)"
    description: >
      Working label for everyday greeting and introduction routines; what
      fits depends on the situation and relationship rather than on a
      single polite/plain switch.
  - id: ja.register.polite-neutral
    name: "Polite-neutral (working label)"
    description: >
      Starting label for teaching purposes; a Japanese-appropriate register
      model must be built during research tasks.
  - id: ja.register.plain-casual
    name: "Plain-casual (planned label)"
    description: >
      Planned label; usage is situation-bound and not freely
      interchangeable with polite wording.

situations:
  - id: ja.situation.first-meeting
    name: "An introduction where people have not met before"
    description: >
      First introductions; fit is shaped by relationship, setting, and
      relative formality rather than a single politeness switch.
    typical_registers:
      - ja.register.polite-neutral
      - ja.register.neutral-common
  - id: ja.situation.classroom
    name: "A classroom or practice setting"
    description: >
      Learning-focused interaction; supports and repair phrases are expected.
    typical_registers:
      - ja.register.polite-neutral
      - ja.register.neutral-common
  - id: ja.situation.shopping
    name: "Buying something in a shop"
    description: >
      Asking prices and completing a small purchase.
    typical_registers:
      - ja.register.polite-neutral
  - id: ja.situation.restaurant
    name: "Ordering at an eatery"
    description: >
      Choosing and receiving food or drink; meal set phrases fit here.
    typical_registers:
      - ja.register.polite-neutral
  - id: ja.situation.directions
    name: "Asking where something is"
    description: >
      Locating places and objects; here/there words and place vocabulary.
    typical_registers:
      - ja.register.polite-neutral
      - ja.register.neutral-common
  - id: ja.situation.home-routine
    name: "Talking about a daily routine"
    description: >
      Describing one's own day; plain register common with family.
    typical_registers:
      - ja.register.neutral-common
      - ja.register.plain-casual
  - id: ja.situation.post-office
    name: "Sending mail or a parcel at the post office counter"
    description: >
      Handing over a parcel, answering about contents and speed, paying.
    typical_registers:
      - ja.register.polite-neutral
  - id: ja.situation.lost-found
    name: "Reporting or claiming a lost item"
    description: >
      Describing an item to an official and filing a report; polite wording
      throughout.
    typical_registers:
      - ja.register.polite-neutral
  - id: ja.situation.payments
    name: "Paying a bill or fee at a counter"
    description: >
      Presenting a slip, choosing a payment method, asking about fees.
    typical_registers:
      - ja.register.polite-neutral
  - id: ja.situation.civic-office
    name: "Handling paperwork at the ward or city office"
    description: >
      Notifications, certificates, forms, and signatures at a public window.
    typical_registers:
      - ja.register.polite-neutral
  - id: ja.situation.phone-call
    name: "Making or answering a phone call"
    description: >
      Phone set phrases, messages, and call-backs; the caller is unseen.
    typical_registers:
      - ja.register.polite-neutral
  - id: ja.situation.clinic
    name: "Booking or attending a clinic visit"
    description: >
      Symptoms, appointments, insurance cards; polite with reception.
    typical_registers:
      - ja.register.polite-neutral
  - id: ja.situation.pharmacy
    name: "Buying medicine at the pharmacy"
    description: >
      Describing symptoms briefly and following dosing instructions.
    typical_registers:
      - ja.register.polite-neutral
  - id: ja.situation.plans
    name: "Making or changing plans with a friend"
    description: >
      Meeting times and places; casual wording common between friends.
    typical_registers:
      - ja.register.polite-neutral
      - ja.register.plain-casual
  - id: ja.situation.office
    name: "Routine office communication"
    description: >
      Internal notices, room booking, and replies between colleagues,
      with clients possible on the same thread; polite wording is the
      safe default, casual wording is relationship-bound.
    typical_registers:
      - ja.register.polite-neutral
      - ja.register.plain-casual
  - id: ja.situation.movie-discussion
    name: "Talking about a film with someone"
    description: >
      Recommending, describing, and reacting to a film after watching
      it; register follows how well the speakers know each other.
    typical_registers:
      - ja.register.plain-casual
      - ja.register.polite-neutral
