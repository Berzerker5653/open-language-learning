id: "ja.unit.onramp.greeting"
goal_id: "ja.goal.onramp.respond-to-greeting"
title: "Meeting and greeting"
summary: >
  Encounter, comprehend, and produce a first-meeting greeting routine,
  ending in a supported scenario interaction.
estimated_minutes: 10
activities:
  - id: "ja.activity.onramp.encounter-greet"
    type: "encounter"
    modality: "reading"
    support_level: 5
    content_refs: ["ja.lex.greeting.konnichiwa"]
  - id: "ja.activity.onramp.listen-greet"
    type: "comprehension"
    modality: "listening"
    support_level: 3
    content_refs: ["ja.lex.greeting.konnichiwa"]
  - id: "ja.activity.onramp.speak-greet"
    type: "retrieval"
    modality: "speaking"
    support_level: 3
    content_refs: ["ja.lex.greeting.konnichiwa"]
  - id: "ja.activity.onramp.scenario-greet"
    type: "scenario"
    modality: "interaction"
    support_level: 2
    scenario_id: "ja.scenario.first-meeting.greeting"
