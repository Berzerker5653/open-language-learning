- id: ja.activity.b2-film-opinion-cloze
  type: cloze
  modality: writing
  support_level: 1
  content_refs:
  - ja.sent.film-long-interesting
  - ja.sent.film-friend-recommended
- id: ja.activity.b2-film-opinion-recall
  type: recall-choice
  modality: reading
  support_level: 1
  content_refs:
  - ja.sent.film-long-interesting
  - ja.sent.film-friend-recommended
  - ja.grammar.b2.ga-concessive
  - ja.grammar.b2.te-age-kure-morai
- id: ja.activity.b2-film-opinion-write
  type: recall
  modality: writing
  support_level: 0
  content_refs:
  - ja.sent.film-long-interesting
  - ja.sent.film-friend-recommended
  - ja.lex.film.eiga
  - ja.lex.film.kantoku
generation_contract:
  allowed_vocab:
  - ja.sent.film-long-interesting
  - ja.sent.film-friend-recommended
  - ja.lex.film.eiga
  - ja.lex.film.kantoku
  allowed_grammar:
  - ja.grammar.b2.ga-concessive
  - ja.grammar.b2.te-age-kure-morai
  - ja.grammar.syntax.relative-clauses
  new_item_budget: 4
  register:
  - ja.register.polite-neutral
  expected_interpretations:
  - 'Film evaluation: concede one drawback with mid-sentence が, then the stronger point; report who recommended it with てもらった.'
