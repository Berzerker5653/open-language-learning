# ai-assisted draft unit (R12 journey ja B2 film-analysis, stages 1-4); content refs are pack data; qualified review pending.
id: ja.unit.b2-film-opinion
goal_id: ja.goal.b2.film-analysis
title: "Film opinion: concessive が and favor verbs"
summary: "B2 film evaluation: ながいが、おもしろい contrast; もらった relative clause."
