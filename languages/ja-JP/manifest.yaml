schema_version: "0.2"
pack_id: "org.openlanguage.ja-jp.reference"
display_name: "Japanese Reference Pack"
version: "0.4.3"
target_locale: "ja-JP"
source_locales: ["en-US"]
engine:
  min_version: "0.1.0"
  max_version_exclusive: "2.0.0"
maturity: "experimental"
authors: ["Open Language Learning Platform contributors"]
scripts:
  - "ja.orth.hiragana"
  - "ja.orth.katakana"
  - "ja.orth.kanji"
  - "ja.orth.latin"
# SETTINGS-SCOPE-001: this pack grants the romanization-display settings
# section. A pack published BEFORE this field existed declares nothing and
# therefore shows no such section — the 0.4.3 archive predates the rule;
# the next republish carries the declaration.
settings_capabilities:
  - "romanization-display"
world: environments.jsonl
capabilities:
  listening: true
  speaking: true
  reading: true
  writing: true
  pronunciation_assessment: false
  prosody_assessment: false
  handwriting: false
  rtl: false
  scenario_help: true
  # IN-APP-IME-001 phase 2: this pack's in-app input methods. Declarative
  # only — the ids name what the engine may offer for this pack; packs
  # never execute code. Absent on a pack means the engine keeps the
  # pack's current behavior; this map is the explicit allowlist.
  input_methods:
    romaji-kana: true
    lexicon-candidates: true
requested_model_capabilities:
  - "asr.ja"
  - "vad"
  - "alignment.ja"
  - "f0"
license:
  content_license: "CC-BY-SA-4.0"
  redistribution_allowed: true
