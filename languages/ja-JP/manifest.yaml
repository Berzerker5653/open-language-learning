schema_version: "0.2"
pack_id: "org.openlanguage.ja-jp.reference"
display_name: "Japanese Reference Pack"
version: "0.2.1"
target_locale: "ja-JP"
source_locales: ["en-US"]
engine:
  min_version: "0.1.0"
  max_version_exclusive: "2.0.0"
maturity: "experimental"
authors: ["Open Language Learning Platform contributors"]
scripts:
  - "ja.orth.hiragana"
  - "ja.orth.katakana"
  - "ja.orth.kanji"
  - "ja.orth.latin"
world: environments.jsonl
capabilities:
  listening: true
  speaking: true
  reading: true
  writing: true
  pronunciation_assessment: false
  prosody_assessment: false
  handwriting: false
  rtl: false
requested_model_capabilities:
  - "asr.ja"
  - "vad"
  - "tts.ja"
  - "alignment.ja"
  - "f0"
license:
  content_license: "CC-BY-4.0"
  redistribution_allowed: true
