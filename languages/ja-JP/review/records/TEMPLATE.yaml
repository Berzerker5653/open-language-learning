# Review record template (REVIEW_POLICY.yaml v1.0.0).
# Copy to review/records/<batch>-<review-type>-<n>.yaml and fill in.
# Personal details stay private; use a pseudonym unless you consent to
# public attribution.

reviewer_pseudonym: ""
reviewer_qualification_category: ""   # see review_types.*.qualifications in REVIEW_POLICY.yaml
attribution_consent: false
review_type: ""                       # linguistic | pedagogical | technical
reviewed_ids_or_range: []             # stable content IDs reviewed
content_versions: {}                  # pack id -> version reviewed
date: ""                              # YYYY-MM-DD
issues: []
  # - severity: P0 | P1 | P2 | P3
  #   id: <content id>
  #   description: ""
  #   resolution: fixed | deferred | rejected
unresolved_disagreements: []
adjudication: ""                      # escalation outcome, if any
sampling: ""                          # full | stratified:<method,seed,size>
