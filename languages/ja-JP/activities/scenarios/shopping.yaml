# ai-assisted draft scenario (K-30); wording pending qualified review.
id: ja.scenario.shopping.market
goal_id: ja.goal.a1.shop-ask-price
title: At the shop
situation: ja.situation.shopping
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.shopping.market.open
  prompt: You pick up an item. Ask how much it is.
  expected_actions:
  - ask-price
  action_labels:
    ask-repeat: "Politely ask them to repeat"
    ask-price: "Ask how much the item is"
  support:
    - level: 3
      kind: model
      text: "すみません、これはいくらですか。 (sumimasen, kore wa ikura desu ka)"
    - level: 5
      kind: gloss
      text: "Ask the price: これはいくらですか (kore wa ikura desu ka) — 'how much is this?'. Start with すみません (sumimasen) to get the shopkeeper's attention; いくら (ikura) means 'how much'."
  next:
  - ja.scenario.shopping.market.buy
  recovery:
  - id: ja.scenario.shopping.market.repair-repeat
    prompt: You did not catch the price. Politely ask them to repeat it.
    expected_actions:
    - ask-repeat
    to: ja.scenario.shopping.market.open
- id: ja.scenario.shopping.market.buy
  prompt: The price is fine. Say you will buy it and hand over money.
  expected_actions:
  - state-buy
  - hand-money
  action_labels:
    state-buy: "Say you will take the item"
    hand-money: "Offer to pay now"
  support:
    - level: 3
      kind: model
      text: "これをください。ここで払います。 (kore o kudasai. koko de haraimasu)"
    - level: 5
      kind: gloss
      text: "Say you want it: これをください (kore o kudasai) — 'this one, please'. For handing over money: ここで払います (koko de haraimasu) — 'I will pay here'; 払う (harau) is 'to pay'."
  next:
  - ja.scenario.shopping.market.close
- id: ja.scenario.shopping.market.close
  prompt: They thank you. Close with a polite thanks.
  expected_actions:
  - say-thanks
  action_labels:
    say-thanks: "Close with a polite thank-you"
  support:
    - level: 3
      kind: model
      text: "ありがとうございます。 (arigatou gozaimasu)"
    - level: 5
      kind: gloss
      text: "Close with the polite thank-you used across this pack: ありがとうございます (arigatou gozaimasu) — 'thank you very much'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.shopping.market.bookstore
  description: Buying books at a bookstore
  changed_variable: shop kind
- id: ja.scenario.shopping.market.bakery
  description: Buying bread in the morning
  changed_variable: time and goods
