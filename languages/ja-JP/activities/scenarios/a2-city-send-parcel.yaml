# ai-assisted draft scenario (JA-A2-001); wording pending qualified review.
id: ja.scenario.a2.city.send-parcel
goal_id: ja.goal.a2.city-services
title: "At the post office counter"
situation: ja.situation.post-office
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.a2.city.send-parcel.open
  prompt: "You have a box to send. Tell the clerk you want to send a parcel."
  expected_actions:
  - state-send-request
  action_labels:
    ask-repeat: "Politely ask them to repeat"
    state-send-request: "Say you want to send a parcel"
  support:
    - level: 3
      kind: model
      text: "荷物を 送りたいです。 (nimotsu o okuritai desu)"
    - level: 5
      kind: gloss
      text: "Use the pack opener: 荷物 (nimotsu) — 'parcel/luggage'; 送りたい (okuritai) — 'want to send'. 送る (okuru) is 'to send'."
  next:
  - ja.scenario.a2.city.send-parcel.contents
  recovery:
  - id: ja.scenario.a2.city.send-parcel.repair-repeat
    prompt: "The clerk asked something you missed. Politely ask them to repeat."
    expected_actions:
    - ask-repeat
    to: ja.scenario.a2.city.send-parcel.open
- id: ja.scenario.a2.city.send-parcel.contents
  prompt: "The clerk asks what is inside. Say what the contents are."
  expected_actions:
  - state-contents
  action_labels:
    state-contents: "Say what is inside the box"
  support:
    - level: 3
      kind: model
      text: "中身は 本と 服です。 (nakami wa hon to fuku desu)"
    - level: 5
      kind: gloss
      text: "Answer the clerk's 中身は何ですか (nakami wa nan desu ka, 'what are the contents?') by listing them: 中身 (nakami) 'contents'; 本 (hon) 'books'; 服 (fuku) 'clothes'."
  next:
  - ja.scenario.a2.city.send-parcel.price
- id: ja.scenario.a2.city.send-parcel.price
  prompt: "Ask how much shipping costs and whether it arrives in three days."
  expected_actions:
  - ask-price
  - confirm-arrival
  action_labels:
    ask-price: "Ask the shipping cost"
    confirm-arrival: "Ask if it arrives in three days"
  support:
    - level: 3
      kind: model
      text: "送料は いくらですか。三日で 届きますか。 (souryou wa ikura desu ka. mikka de todokimasu ka)"
    - level: 5
      kind: gloss
      text: "Both lines follow pack phrases: 送料はいくらですか (souryou wa ikura desu ka) — 'how much is the shipping?' (送料 souryou = shipping cost); 三日で届きます (mikka de todokimasu) — 'it arrives in three days', asked as 届きますか."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.a2.city.send-parcel.express-urgent
  description: "Sending an urgent express envelope for a friend's birthday"
  changed_variable: "speed and reason"
- id: ja.scenario.a2.city.send-parcel.return-parcel
  description: "Sending a parcel back to a shop after a refund"
  changed_variable: "direction and purpose"
