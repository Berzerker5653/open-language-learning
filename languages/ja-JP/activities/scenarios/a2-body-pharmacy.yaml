# ai-assisted draft scenario (JA-A2-001); wording pending qualified review.
id: ja.scenario.a2.body.pharmacy
goal_id: ja.goal.a2.health-body
title: "At the pharmacy counter"
situation: ja.situation.pharmacy
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.a2.body.pharmacy.open
  prompt: "You have a cold. At the pharmacy, say you are looking for cold medicine."
  expected_actions:
  - state-need
  action_labels:
    ask-repeat: "Politely ask them to repeat"
    state-need: "Say you are looking for cold medicine"
  support:
    - level: 3
      kind: model
      text: "風邪薬を 探しているのですが。 (kaze-gusuri o sagashite iru no desu ga)"
    - level: 5
      kind: gloss
      text: "Use the pack's pharmacy opener: 風邪薬 (kaze-gusuri) — 'cold medicine'; 探している (sagashite iru) — 'looking for', softened with のですが."
  next:
  - ja.scenario.a2.body.pharmacy.symptom
  recovery:
  - id: ja.scenario.a2.body.pharmacy.repair-repeat
    prompt: "The pharmacist's question was hard. Politely ask them to repeat it."
    expected_actions:
    - ask-repeat
    to: ja.scenario.a2.body.pharmacy.open
- id: ja.scenario.a2.body.pharmacy.symptom
  prompt: "Describe your fever and cough, and ask how to take it."
  expected_actions:
  - state-symptom
  - ask-dose
  action_labels:
    state-symptom: "Describe your fever and cough"
    ask-dose: "Ask how to take the medicine"
  support:
    - level: 3
      kind: model
      text: "熱と せきが あります。この薬は どう のみますか。 (netsu to seki ga arimasu. kono kusuri wa dou nomimasu ka)"
    - level: 5
      kind: gloss
      text: "State symptoms with the pack form 熱とせきがあります (netsu to seki ga arimasu) — 'I have a fever and a cough'. Ask dosing: 薬 (kusuri) 'medicine'; どう飲みますか (dou nomimasu ka) — 'how do I take it?'."
  next:
  - ja.scenario.a2.body.pharmacy.question
- id: ja.scenario.a2.body.pharmacy.question
  prompt: "Ask about side effects and price, then buy and close."
  expected_actions:
  - ask-safety
  - ask-price
  - say-thanks
  action_labels:
    ask-safety: "Ask about side effects"
    ask-price: "Ask the price"
    say-thanks: "Buy and close with thanks"
  support:
    - level: 3
      kind: model
      text: "副作用は ありますか。いくらに なりますか。ありがとうございます。 (fukusayou wa arimasu ka. ikura ni narimasu ka. arigatou gozaimasu)"
    - level: 5
      kind: gloss
      text: "All three lines are pack phrases: 副作用はありますか (fukusayou wa arimasu ka) — 'are there side effects?' (副作用 = side effects); いくらになりますか (ikura ni narimasu ka) — 'how much will it be?'; ありがとうございます — 'thank you very much'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.a2.body.pharmacy.child-dose
  description: "Buying medicine for your young sister"
  changed_variable: "patient changed"
- id: ja.scenario.a2.body.pharmacy.stomach
  description: "Asking for stomach medicine after eating out"
  changed_variable: "symptom set"
