# ai-assisted draft scenario (JA-A2-001); wording pending qualified review.
id: ja.scenario.a2.admin.move-notification
goal_id: ja.goal.a2.daily-admin
title: "At the ward office window"
situation: ja.situation.civic-office
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.a2.admin.move-notification.open
  prompt: "You moved recently. At the window, say you want to file a moving notification."
  expected_actions:
  - state-purpose
  action_labels:
    ask-list: "Ask which ones are needed"
    state-purpose: "Say you want to file a moving notification"
  support:
    - level: 3
      kind: model
      text: "引っ越しの 届出を したいのですが。 (hikkoshi no todoke o shitai no desu ga)"
    - level: 5
      kind: gloss
      text: "State your purpose with the soft opener 〜したいのですが (~shitai no desu ga) — 'I would like to ~ but…'. 引っ越し (hikkoshi) is 'moving'; 届出 (todoke) is 'notification/registration'."
  next:
  - ja.scenario.a2.admin.move-notification.docs
  recovery:
  - id: ja.scenario.a2.admin.move-notification.repair-repeat
    prompt: "You do not know which documents. Politely ask which ones are needed."
    expected_actions:
    - ask-list
    to: ja.scenario.a2.admin.move-notification.open
- id: ja.scenario.a2.admin.move-notification.docs
  prompt: "The clerk lists what you need. Say what you have and ask about the rest."
  expected_actions:
  - confirm-docs
  - ask-requirements
  action_labels:
    confirm-docs: "Say which documents you have"
    ask-requirements: "Ask what else is needed"
  support:
    - level: 3
      kind: model
      text: "印鑑と 身分証明書が あります。ほかに なにが いますか。 (inkan to mibunshoumeisho ga arimasu. hoka ni nani ga irimasu ka)"
    - level: 5
      kind: gloss
      text: "Say what you have: 印鑑 (inkan) 'seal', 身分証明書 (mibunshoumeisho) 'ID'; あります (arimasu) — 'I have'. Ask about the rest: ほかになにがいますか (hoka ni nani ga irimasu ka) — 'what else is needed?'."
  next:
  - ja.scenario.a2.admin.move-notification.sign
- id: ja.scenario.a2.admin.move-notification.sign
  prompt: "The clerk asks you to sign. Sign and ask whether a certificate is also needed."
  expected_actions:
  - sign-form
  - ask-certificate
  action_labels:
    sign-form: "Sign the form"
    ask-certificate: "Ask whether a certificate is also needed"
  support:
    - level: 3
      kind: model
      text: "ここに 署名します。住民票も いりますか。 (koko ni shomei shimasu. juuminhyou mo irimasu ka)"
    - level: 5
      kind: gloss
      text: "Sign: 署名します (shomei shimasu) — 'I will sign' (the clerk points with ここに署名してください, 'please sign here'). Certificate: 住民票 (juuminhyou) is 'resident certificate'; 住民票もいりますか — 'do I also need a resident certificate?'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.a2.admin.move-notification.certificate-order
  description: "Ordering three resident certificates for a new job"
  changed_variable: "purpose and count"
- id: ja.scenario.a2.admin.move-notification.friend-translates
  description: "A friend helps you file the notification"
  changed_variable: "support speaker"
