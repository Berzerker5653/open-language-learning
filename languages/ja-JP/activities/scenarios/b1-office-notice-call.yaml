# ai-assisted draft scenario (R12 journey, B1 office); wording pending qualified review.
id: ja.scenario.b1.office.notice-call
goal_id: ja.goal.b1.work-professional
title: "Calling a colleague about tomorrow's meeting"
situation: ja.situation.office
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.b1.office.notice-call.open
  prompt: "You call a colleague. Tell them the new time of tomorrow's meeting, using humble wording for your own act of informing."
  expected_actions:
  - state-meeting-time
  - humble-inform
  action_labels:
    ask-confirm: "Ask them to confirm it"
    repeat-time: "Repeat it clearly"
    state-meeting-time: "State the new time for tomorrow's meeting"
    humble-inform: "Use humble wording for informing"
  support:
    - level: 3
      kind: model
      text: "あした の かいぎ は 十時 に かわりました。おしらせ いたします。 (ashita no kaigi wa juuji ni kawarimashita. oshirase itashimasu)"
    - level: 5
      kind: gloss
      text: "State the new time: あした の かいぎ は 十時 です (ashita no kaigi wa juuji desu) — 'tomorrow's meeting is at ten'. For your own act of informing use the humble verb おしらせ いたします (oshirase itashimasu) — 'I humbly inform'; いたします is the humble form of します."
  next:
  - ja.scenario.b1.office.notice-call.room
  recovery:
  - id: ja.scenario.b1.office.notice-call.repair-repeat
    prompt: "The colleague did not catch the time. Repeat it and ask them to confirm."
    expected_actions:
    - repeat-time
    - ask-confirm
    to: ja.scenario.b1.office.notice-call.open
- id: ja.scenario.b1.office.notice-call.room
  prompt: "Ask the colleague to reserve a meeting room, using a polite 〜ていただけますか request."
  expected_actions:
  - request-room
  action_labels:
    request-room: "Ask the colleague to reserve a meeting room"
  support:
    - level: 3
      kind: model
      text: "かいぎしつ を よやく して いただけますか。 (kaigishitsu o yoyaku shite itadakemasu ka)"
    - level: 5
      kind: gloss
      text: "Build the favor request with 〜て いただけますか (te itadakemasu ka) — 'could you please do ~ for me?'. かいぎしつ (kaigishitsu) is 'meeting room'; よやくする (yoyaku suru) is 'to reserve'."
  next:
  - ja.scenario.b1.office.notice-call.close
- id: ja.scenario.b1.office.notice-call.close
  prompt: "Thank them for the confirmation and close the call."
  expected_actions:
  - thank
  - close-call
  action_labels:
    thank: "Thank them for confirming"
    close-call: "Close the call politely"
  support:
    - level: 3
      kind: model
      text: "おしらせ いただき、ありがとうございます。それでは、失礼します。 (oshirase itadaki, arigatou gozaimasu. sore dewa, shitsurei shimasu)"
    - level: 5
      kind: gloss
      text: "Thank the confirmation with the pack phrase おしらせ いただき、ありがとうございます (oshirase itadaki, arigatou gozaimasu) — 'thank you for letting me know'. Close a call with それでは、失礼します (sore dewa, shitsurei shimasu) — polite 'well then, goodbye'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.b1.office.notice-call.email-thread
  description: "The same content as a short email thread instead of a call"
  changed_variable: "channel (phone to email)"
- id: ja.scenario.b1.office.notice-call.client-side
  description: "Informing an outside client about a meeting change"
  changed_variable: "who is informed (colleague to client)"
