# ai-assisted draft scenario (JA-A2-001); wording pending qualified review.
id: ja.scenario.a2.shop.return-exchange
goal_id: ja.goal.a2.shopping-services
title: "Exchanging something at the counter"
situation: ja.situation.shopping
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.a2.shop.return-exchange.open
  prompt: "You bought something but it has a scratch. Tell the clerk you want to exchange it."
  expected_actions:
  - state-problem
  - ask-exchange
  action_labels:
    ask-repeat: "Politely ask them to repeat"
    state-problem: "Explain what is wrong with the item"
    ask-exchange: "Ask for an exchange"
  support:
    - level: 3
      kind: model
      text: "すみません、キズが あります。交換して もらえますか。 (sumimasen, kizu ga arimasu. koukan shite moraemasu ka)"
    - level: 5
      kind: gloss
      text: "Name the problem: キズ (kizu) 'scratch'; 〜があります — 'there is ~'. Exchange with the pack question 交換してもらえますか (koukan shite moraemasu ka) — 'could you exchange it for me?' (交換 koukan 'exchange', 〜てもらう = favor done to you)."
  next:
  - ja.scenario.a2.shop.return-exchange.receipt
  recovery:
  - id: ja.scenario.a2.shop.return-exchange.repair-repeat
    prompt: "You cannot explain the problem well. Politely ask the clerk to repeat the question first."
    expected_actions:
    - ask-repeat
    to: ja.scenario.a2.shop.return-exchange.open
- id: ja.scenario.a2.shop.return-exchange.receipt
  prompt: "The clerk asks for the receipt. Say you have it and hand it over."
  expected_actions:
  - present-receipt
  action_labels:
    present-receipt: "Say you have the receipt and hand it over"
  support:
    - level: 3
      kind: model
      text: "領収書が あります。どうぞ。 (ryoushuusho ga arimasu. douzo)"
    - level: 5
      kind: gloss
      text: "Answer the clerk's 領収書はありますか (ryoushuusho wa arimasu ka, 'do you have the receipt?') with 領収書があります — 'I have the receipt'. 領収書 (ryoushuusho) 'receipt'; どうぞ (douzo) — 'here you are' when handing it over."
  next:
  - ja.scenario.a2.shop.return-exchange.wait
- id: ja.scenario.a2.shop.return-exchange.wait
  prompt: "The clerk offers a new one. Thank the clerk and close."
  expected_actions:
  - say-thanks
  - say-closing
  action_labels:
    say-thanks: "Thank the clerk"
    say-closing: "Close the visit politely"
  support:
    - level: 3
      kind: model
      text: "ありがとうございます。また きます。 (arigatou gozaimasu. mata kimasu)"
    - level: 5
      kind: gloss
      text: "Thank with ありがとうございます (arigatou gozaimasu) — 'thank you very much'. Answer the shop's またお越しください ('please come again') with またきます (mata kimasu) — 'I will come again'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.a2.shop.return-exchange.online-order
  description: "Exchanging the wrong size delivered to a shop"
  changed_variable: "delivery channel"
- id: ja.scenario.a2.shop.return-exchange.late-defect
  description: "Returning a broken item bought last week, no box"
  changed_variable: "time and packaging"
