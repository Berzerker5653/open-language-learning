# ai-assisted draft scenario (JA-A2-001); wording pending qualified review.
id: ja.scenario.a2.admin.bill-payment
goal_id: ja.goal.a2.daily-admin
title: "Paying a bill at the counter"
situation: ja.situation.payments
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.a2.admin.bill-payment.open
  prompt: "You have a payment slip. At the counter, ask whether you can pay it there."
  expected_actions:
  - ask-pay-possible
  action_labels:
    ask-repeat: "Politely ask them to repeat"
    ask-pay-possible: "Ask whether you can pay the slip here"
  support:
    - level: 3
      kind: model
      text: "この納付書は ここで 支払えますか。 (kono nouhousho wa koko de haraemasu ka)"
    - level: 5
      kind: gloss
      text: "Ask if payment is possible here: 納付書 (nouhousho) is 'payment slip'; 支払えますか (haraemasu ka) — 'can (I) pay?'. Full model line: この納付書はここで支払えますか — 'can I pay this slip here?'."
  next:
  - ja.scenario.a2.admin.bill-payment.method
  recovery:
  - id: ja.scenario.a2.admin.bill-payment.repair-repeat
    prompt: "You did not understand the fee question. Politely ask again."
    expected_actions:
    - ask-repeat
    to: ja.scenario.a2.admin.bill-payment.open
- id: ja.scenario.a2.admin.bill-payment.method
  prompt: "The clerk asks cash or card. Choose and confirm the fee and amount."
  expected_actions:
  - choose-method
  - confirm-amount
  action_labels:
    choose-method: "Choose cash or card"
    confirm-amount: "Confirm the fee and total amount"
  support:
    - level: 3
      kind: model
      text: "カードで 払います。手数料は いくらですか。 (kaado de haraimasu. tesuuryou wa ikura desu ka)"
    - level: 5
      kind: gloss
      text: "Choose: カードで払います (kaado de haraimasu) — 'I will pay by card' (現金 genkin = cash). Check the fee: 手数料 (tesuuryou) is 'handling fee'; 手数料はいくらですか — 'how much is the fee?'."
  next:
  - ja.scenario.a2.admin.bill-payment.receipt
- id: ja.scenario.a2.admin.bill-payment.receipt
  prompt: "Ask for a receipt and close with thanks."
  expected_actions:
  - ask-receipt
  - say-thanks
  action_labels:
    ask-receipt: "Ask for a receipt"
    say-thanks: "Close with thanks"
  support:
    - level: 3
      kind: model
      text: "領収書を いただけますか。ありがとうございます。 (ryoushuusho o itadakemasu ka. arigatou gozaimasu)"
    - level: 5
      kind: gloss
      text: "Use the pack's receipt request: 領収書 (ryoushuusho) is 'receipt'; いただけますか (itadakemasu ka) — 'could I receive?'. Close with ありがとうございます (arigatou gozaimasu) — 'thank you very much'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.a2.admin.bill-payment.bank-transfer
  description: "Paying the same bill by bank transfer instead"
  changed_variable: "payment channel"
- id: ja.scenario.a2.admin.bill-payment.phone-plan
  description: "Paying a phone bill at the shop counter"
  changed_variable: "bill kind and place"
