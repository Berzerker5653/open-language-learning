# ai-assisted draft scenario (JA-A2-001); wording pending qualified review.
id: ja.scenario.a2.comm.text-reschedule
goal_id: ja.goal.a2.communication
title: "Changing plans by text"
situation: ja.situation.plans
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.a2.comm.text-reschedule.open
  prompt: "You will be late for a meeting. Send a text that you are running late."
  expected_actions:
  - state-delay
  action_labels:
    state-location: "Say where you are now"
    state-delay: "Say you are running late"
  support:
    - level: 3
      kind: model
      text: "すみません、少し 遅れます。 (sumimasen, sukoshi okuremasu)"
    - level: 5
      kind: gloss
      text: "Apologize and state the delay: 遅れます (okuremasu) — 'I will be late'; 少し (sukoshi) 'a little'. Pack model line: すみません、少し遅れます."
  next:
  - ja.scenario.a2.comm.text-reschedule.time
  recovery:
  - id: ja.scenario.a2.comm.text-reschedule.repair-clarify
    prompt: "Your friend asks where you are. Say where you are now."
    expected_actions:
    - state-location
    to: ja.scenario.a2.comm.text-reschedule.open
- id: ja.scenario.a2.comm.text-reschedule.time
  prompt: "Your friend asks what time you will arrive. Give a time."
  expected_actions:
  - state-time
  action_labels:
    state-time: "Give your arrival time"
  support:
    - level: 3
      kind: model
      text: "六時ごろに  つきます。 (rokuji goro ni tsukimasu)"
    - level: 5
      kind: gloss
      text: "Answer the pack question 何時につきますか (nan-ji ni tsukimasu ka, 'what time will you arrive?') with a time: 六時ごろにつきます (rokuji goro ni tsukimasu) — 'I will arrive around six'; 着く (tsuku) 'to arrive'."
  next:
  - ja.scenario.a2.comm.text-reschedule.meet
- id: ja.scenario.a2.comm.text-reschedule.meet
  prompt: "Agree where to meet (station exit) and send a short confirmation."
  expected_actions:
  - agree-meeting-point
  - confirm-short
  action_labels:
    agree-meeting-point: "Agree where to meet"
    confirm-short: "Send a short confirmation"
  support:
    - level: 3
      kind: model
      text: "えきの 出口で まちます。了解! (eki no deguchi de machimasu. ryoukai!)"
    - level: 5
      kind: gloss
      text: "Pack lines: えきの出口でまちます (eki no deguchi de machimasu) — 'I will wait at the station exit' (出口 deguchi 'exit', 待つ matsu 'to wait'); short text confirmation: 了解 (ryoukai) — 'got it!'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.a2.comm.text-reschedule.rain-cancel
  description: "Canceling today and proposing next weekend instead"
  changed_variable: "weather and time"
- id: ja.scenario.a2.comm.text-reschedule.late-arrival
  description: "You arrive but the friend is late instead"
  changed_variable: "roles swapped"
