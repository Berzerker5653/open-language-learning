# ai-assisted draft scenario (JA-A2-001); wording pending qualified review.
id: ja.scenario.a2.comm.answer-phone
goal_id: ja.goal.a2.communication
title: "Answering and taking a message"
situation: ja.situation.phone-call
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.a2.comm.answer-phone.open
  prompt: "The phone rings. Answer and give your name."
  expected_actions:
  - answer-phone
  - identify-self
  action_labels:
    ask-repeat: "Politely ask them to repeat"
    answer-phone: "Pick up the phone"
    identify-self: "Give your name"
  support:
    - level: 3
      kind: model
      text: "もしもし、山田です。 (moshi moshi, yamada desu)"
    - level: 5
      kind: gloss
      text: "Answer the phone with もしもし (moshi moshi) — 'hello (on the phone)', then your name + です (desu): 山田です (Yamada desu) — 'this is Yamada'."
  next:
  - ja.scenario.a2.comm.answer-phone.caller
  recovery:
  - id: ja.scenario.a2.comm.answer-phone.repair-repeat
    prompt: "The caller is unclear. Politely ask them to repeat their name."
    expected_actions:
    - ask-repeat
    to: ja.scenario.a2.comm.answer-phone.open
- id: ja.scenario.a2.comm.answer-phone.caller
  prompt: "The caller asks if your roommate is there. Say yes or no and offer help."
  expected_actions:
  - confirm-presence
  - offer-help
  action_labels:
    confirm-presence: "Say whether the person is there"
    offer-help: "Offer to help the caller"
  support:
    - level: 3
      kind: model
      text: "今、いえに いません。伝言を おねがいします。 (ima, ie ni imasen. dengon o onegai shimasu)"
    - level: 5
      kind: gloss
      text: "Absence: 今、いえにいません (ima, ie ni imasen) — 'he/she is not home now'. Offer help: 伝言 (dengon) is 'message'; 伝言をおねがいします — 'please leave a message, please'."
  next:
  - ja.scenario.a2.comm.answer-phone.message
- id: ja.scenario.a2.comm.answer-phone.message
  prompt: "Take the message and say you will pass it on."
  expected_actions:
  - take-message
  - promise-pass
  action_labels:
    take-message: "Take down the message"
    promise-pass: "Promise to pass it on"
  support:
    - level: 3
      kind: model
      text: "名前と 電話番号を かきます。あとで 伝えます。 (namae to denwabangou o kakimasu. ato de tsutaemasu)"
    - level: 5
      kind: gloss
      text: "Offer to write it down: 名前 (namae) 'name', 電話番号 (denwabangou) 'phone number', 書きます (kakimasu) 'I will write'. Promise: 伝える (tsutaeru) 'to pass on'; あとで伝えます (ato de tsutaemasu) — 'I will pass it on later'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.a2.comm.answer-phone.voicemail-call
  description: "Hearing a voicemail greeting and leaving a message"
  changed_variable: "channel"
- id: ja.scenario.a2.comm.answer-phone.doctor-calls
  description: "Your clinic calls you back about an appointment"
  changed_variable: "caller identity"
