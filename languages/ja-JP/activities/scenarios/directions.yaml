# ai-assisted draft scenario (K-30); wording pending qualified review.
id: ja.scenario.directions.station
goal_id: ja.goal.a1.ask-location
title: Finding the station
situation: ja.situation.directions
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.directions.station.open
  prompt: You are on the street. Politely get attention and ask where the station is.
  expected_actions:
  - get-attention
  - ask-location
  action_labels:
    ask-repeat: "Politely ask them to repeat"
    get-attention: "Politely get a passer-by's attention"
    ask-location: "Ask where the station is"
  support:
    - level: 3
      kind: model
      text: "すみません、えきは どこですか。 (sumimasen, eki wa doko desu ka)"
    - level: 5
      kind: gloss
      text: "Get attention with すみません (sumimasen) — 'excuse me'. Then ask: えきは どこですか (eki wa doko desu ka) — 'where is the station?'. えき (eki) is 'station'; どこ (doko) is 'where'."
  next:
  - ja.scenario.directions.station.confirm
  recovery:
  - id: ja.scenario.directions.station.repair-repeat
    prompt: You did not understand the answer. Politely ask again.
    expected_actions:
    - ask-repeat
    to: ja.scenario.directions.station.open
- id: ja.scenario.directions.station.confirm
  prompt: They point. Confirm whether it is here or there.
  expected_actions:
  - confirm-location
  action_labels:
    confirm-location: "Confirm whether it is here or over there"
  support:
    - level: 3
      kind: model
      text: "あちらですか。 (achira desu ka)"
    - level: 5
      kind: gloss
      text: "Check which place the pointing means: あちらですか (achira desu ka) — 'is it over there?'. あちら (achira) is 'over there' and ここ (koko) is 'here'."
  next:
  - ja.scenario.directions.station.close
- id: ja.scenario.directions.station.close
  prompt: Thank the person and go.
  expected_actions:
  - say-thanks
  action_labels:
    say-thanks: "Thank the person politely"
  support:
    - level: 3
      kind: model
      text: "ありがとうございます。 (arigatou gozaimasu)"
    - level: 5
      kind: gloss
      text: "Thank them with the pack's polite thank-you: ありがとうございます (arigatou gozaimasu) — 'thank you very much'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.directions.station.library
  description: Looking for the library
  changed_variable: place
- id: ja.scenario.directions.station.park
  description: Looking for the park near the school
  changed_variable: place and starting point
