# ai-assisted draft scenario (R12 journey, B2 film talk); wording pending qualified review.
id: ja.scenario.b2.film.movie-talk
goal_id: ja.goal.b2.film-analysis
title: "Talking about a film after watching it"
situation: ja.situation.movie-discussion
register: ja.register.plain-casual
nodes:
- id: ja.scenario.b2.film.movie-talk.react
  prompt: "A friend asks about the film you watched. Give one honest reaction that concedes a drawback but states the stronger point (contrast in one sentence)."
  expected_actions:
  - concede-drawback
  - state-main-point
  action_labels:
    give-concrete-point: "Name one concrete point"
    concede-drawback: "Admit one weakness of the film"
    state-main-point: "State your stronger point"
  support:
    - level: 3
      kind: model
      text: "長かったけど、この映画はとてもおもしろいよ。 (nagakatta kedo, kono eiga wa totemo omoshiroi yo)"
    - level: 5
      kind: gloss
      text: "Concede, then contrast in one sentence: 長かったけど (nagakatta kedo) — 'it was long, but…', followed by your main point とてもおもしろい (totemo omoshiroi) — 'really interesting'. Keep plain-casual forms here."
  next:
  - ja.scenario.b2.film.movie-talk.source
  recovery:
  - id: ja.scenario.b2.film.movie-talk.repair-unclear
    prompt: "Your friend did not follow which part you liked. Name one concrete point."
    expected_actions:
    - give-concrete-point
    to: ja.scenario.b2.film.movie-talk.react
- id: ja.scenario.b2.film.movie-talk.source
  prompt: "Say who recommended the film to you (favor direction matters), and what the teacher or a friend pointed out about it."
  expected_actions:
  - name-recommender
  - favor-direction
  action_labels:
    name-recommender: "Say who recommended the film"
    favor-direction: "Mark the favor as done for you"
  support:
    - level: 3
      kind: model
      text: "この映画は ともだちに しょうかい してもらったんだよ。 (kono eiga wa tomodachi ni shokai shite morattanda yo)"
    - level: 5
      kind: gloss
      text: "Favor direction uses 〜てもらう (te morau): someone did ~ for you. ともだちに しょうかい してもらった (tomodachi ni shokai shite moratta) — 'a friend recommended it to me'; しょうかいする (shokai suru) is 'to recommend, to introduce'."
  next:
  - ja.scenario.b2.film.movie-talk.recommend
- id: ja.scenario.b2.film.movie-talk.recommend
  prompt: "The friend has not seen it yet. Offer to lend or push them to watch it, and close the conversation."
  expected_actions:
  - offer-recommend
  - close-talk
  action_labels:
    offer-recommend: "Offer to lend it and push them to watch"
    close-talk: "Close the conversation"
  support:
    - level: 3
      kind: model
      text: "おもしろいから、ぜひ みてよ。DVD も かして あげるよ。じゃ、またね。 (omoshiroi kara, zehi mite yo. DVD mo kashite ageru yo. ja, mata ne)"
    - level: 5
      kind: gloss
      text: "Push them with ぜひ plus the te-form: ぜひ みて (zehi mite) — 'please do watch it'. Lending stays casual: かして あげる (kashite ageru) — 'I will lend it to you'. Close with じゃ、また (ja, mata) — 'see you'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.b2.film.movie-talk.coworker-polite
  description: "The same film talk with a coworker you address politely"
  changed_variable: "relationship and register"
- id: ja.scenario.b2.film.movie-talk.documentary
  description: "Talking about a documentary instead of a feature film"
  changed_variable: "film type"
