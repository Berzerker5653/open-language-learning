# First-meeting greeting scenario graph (schema 0.2 scenario).
# Populated 2026-10-03 (ai-assisted, draft/unreviewed) now that the
# scenario runtime exists (SCENARIO-001); the 0.1 structural placeholder
# deferred the graph until then. Dialogue wording requires qualified
# human review (REVIEW-001) before promotion; prompts use the pack's
# own draft lexicon items and working register labels.
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
id: "ja.scenario.first-meeting.greeting"
goal_id: "ja.goal.onramp.respond-to-greeting"
title: "First meeting"
situation: "ja.situation.first-meeting"
register: "ja.register.polite-neutral"
nodes:
  - id: "ja.scenario.first-meeting.greeting.open"
    prompt: "Someone you have not met before greets you: こんにちは。Reply with a fitting short greeting."
    expected_actions: ["respond-greeting"]
    action_labels:
      respond-greeting: "Greet them back"
      ask-repeat: "Politely ask them to repeat the greeting"
    support:
      - level: 3
        kind: model
        text: "こんにちは。 konnichiwa."
      - level: 5
        kind: model
        text: "こんにちは。(konnichiwa.) — the polite daytime greeting, said back to them."
    next: ["ja.scenario.first-meeting.greeting.introduce"]
    recovery:
      - id: "ja.scenario.first-meeting.greeting.repair-repeat"
        prompt: "You did not catch the greeting. Politely ask them to repeat it."
        expected_actions: ["ask-repeat"]
        to: "ja.scenario.first-meeting.greeting.open"
  - id: "ja.scenario.first-meeting.greeting.introduce"
    prompt: "They wait, smiling. Mark that you have not met before and give your name."
    expected_actions: ["state-first-meeting", "state-name"]
    action_labels:
      state-first-meeting: "Say this is a first meeting"
      state-name: "Give your name"
      ask-slowly: "Ask them to say their name slowly first"
    support:
      - level: 3
        kind: model
        text: "はじめまして。わたしの なまえは タナカです。 hajimemashite. watashi no namae wa Tanaka desu."
      - level: 5
        kind: model
        text: "はじめまして。わたしの なまえは タナカです。(hajimemashite. watashi no namae wa Tanaka desu.) — 'How do you do — nice to meet you. My name is Tanaka.' Swap in your own name."
    next: ["ja.scenario.first-meeting.greeting.close"]
    recovery:
      - id: "ja.scenario.first-meeting.greeting.repair-slower"
        prompt: "You are unsure how to say your name. Ask them to say theirs slowly first."
        expected_actions: ["ask-slowly"]
        to: "ja.scenario.first-meeting.greeting.introduce"
  - id: "ja.scenario.first-meeting.greeting.close"
    prompt: "Wrap up the introduction with a polite closing."
    expected_actions: ["say-closing"]
    action_labels:
      say-closing: "Close with the polite set phrase"
    support:
      - level: 3
        kind: model
        text: "どうぞ よろしく おねがいします。 douzo yoroshiku onegaishimasu."
      - level: 5
        kind: model
        text: "どうぞ よろしく おねがいします。(douzo yoroshiku onegaishimasu.) — 'Pleased to meet you.' The set closing for an introduction."
    next: []
support_ladder:
  - support_level: 0
    description: "No supports"
  - support_level: 3
    description: "Model response in Japanese script with romaji scaffold"
  - support_level: 5
    description: "Full suggested wording including a first-language gloss"
transfer_variants_required: 2
transfer_variants:
  - id: "ja.scenario.first-meeting.greeting.classmate"
    description: "First meeting with a new classmate"
    changed_variable: "relationship"
  - id: "ja.scenario.first-meeting.greeting.neighbour"
    description: "Greeting a neighbour you have not met, outside the home"
    changed_variable: "location"
