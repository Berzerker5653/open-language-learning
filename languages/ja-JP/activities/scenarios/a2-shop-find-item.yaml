# ai-assisted draft scenario (JA-A2-001); wording pending qualified review.
id: ja.scenario.a2.shop.find-item
goal_id: ja.goal.a2.shopping-services
title: "Finding something in a department store"
situation: ja.situation.shopping
register: ja.register.polite-neutral
nodes:
- id: ja.scenario.a2.shop.find-item.open
  prompt: "You want a birthday gift but cannot find it. Politely get a clerk's attention and ask where the CD corner is."
  expected_actions:
  - get-attention
  - ask-location
  action_labels:
    ask-repeat: "Politely ask them to repeat"
    get-attention: "Politely get the clerk's attention"
    ask-location: "Ask where the CD corner is"
  support:
    - level: 3
      kind: model
      text: "すみません、少し よろしいですか。CDコーナーは どこにありますか。 (sumimasen, sukoshi yoroshii desu ka. shii-dii koonaa wa doko ni arimasu ka)"
    - level: 5
      kind: gloss
      text: "Both lines are pack phrases: すみません、少しよろしいですか (sumimasen, sukoshi yoroshii desu ka) — 'excuse me, may I ask a moment?'; ask with この商品はどこにありますか pattern — どこにありますか (doko ni arimasu ka) 'where is ~?'."
  next:
  - ja.scenario.a2.shop.find-item.confirm
  recovery:
  - id: ja.scenario.a2.shop.find-item.repair-repeat
    prompt: "You did not catch the answer. Politely ask the clerk to repeat it."
    expected_actions:
    - ask-repeat
    to: ja.scenario.a2.shop.find-item.open
- id: ja.scenario.a2.shop.find-item.confirm
  prompt: "The clerk mentions the basement and the escalator. Confirm where the escalator is."
  expected_actions:
  - ask-location
  - confirm-location
  action_labels:
    ask-location: "Ask where the escalator is"
    confirm-location: "Confirm the direction the clerk meant"
  support:
    - level: 3
      kind: model
      text: "エスカレーターは どこですか。あちらですか。 (esukareetaa wa doko desu ka. achira desu ka)"
    - level: 5
      kind: gloss
      text: "Follow the pack exchange (エスカレーターはあちらです, 'the escalator is over there'): ask エスカレーターはどこですか — 'where is the escalator?'; confirm あちらですか (achira desu ka) — 'is it over there?'. エスカレーター (esukareetaa) 'escalator'."
  next:
  - ja.scenario.a2.shop.find-item.choose
- id: ja.scenario.a2.shop.find-item.choose
  prompt: "At the corner you must decide. Say what kind of gift you want and pick one."
  expected_actions:
  - state-choice
  action_labels:
    state-choice: "Say which gift you decide on"
  support:
    - level: 3
      kind: model
      text: "音楽の CDに します。これを ください。 (ongaku no shii-dii ni shimasu. kore o kudasai)"
    - level: 5
      kind: gloss
      text: "Decide with the pack pattern 〜にします (ni shimasu) — 'I will take/go with ~' (cf. これにします, 'I will take this one'). 音楽のCD (ongaku no shii-dii) 'a music CD'; これをください — 'this one, please'."
  next: []
# U07 support payloads and action labels: ai-drafted 2026-10-19; qualified human review required (REVIEW-001).
support_ladder:
- support_level: 0
  description: No supports
- support_level: 3
  description: Model response in Japanese script with romaji scaffold
- support_level: 5
  description: Full suggested wording including a first-language gloss
transfer_variants_required: 2
transfer_variants:
- id: ja.scenario.a2.shop.find-item.bookstore
  description: "Looking for a specific book in a bookstore"
  changed_variable: "goods and shop"
- id: ja.scenario.a2.shop.find-item.gift-for-teacher
  description: "Buying a thank-you gift for a teacher, with a classmate"
  changed_variable: "gift target and companion"
