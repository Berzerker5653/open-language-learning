generation_contract:
  allowed_vocab: *v
  allowed_grammar: *g
  new_item_budget: 6
  register: []
  expected_interpretations: ["Training: business letter with taught forms only."]
  prohibited_ambiguity: ["Do not confuse стажировка (internship) with подработка (side job)."]
  target_proficiency: "B2"
  validation_method: "choice"
