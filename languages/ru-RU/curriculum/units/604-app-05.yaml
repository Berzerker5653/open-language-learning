  - id: "ru.activity.b2.u604-grammar"
    type: "encounter-read"
    modality: "reading"
    support_level: 1
    content_refs:
      &g ["ru.grammar.on-ramp.eto-identification", "ru.grammar.on-ramp.zero-present-copula"]
  - id: "ru.activity.b2.u604-cloze"
    type: "cloze"
    modality: "writing"
    support_level: 1
    content_refs: ["ru.sent.b2.u604"]
