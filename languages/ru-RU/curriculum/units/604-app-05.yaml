id: "ru.unit.b2.app-05"
goal_id: "ru.goal.b2.professional-writing"
title: "Training"
summary: "наставничество, стажировка, практикант, подработка and совместительство."
estimated_minutes: 8
activities:
  - id: "ru.activity.b2.u604-read"
    type: "encounter-read"
    modality: "reading"
    support_level: 1
    content_refs:
      &v [
        "ru.lex.prof.nastavnichestvo",
        "ru.lex.prof.stazhirovka",
        "ru.lex.prof.praktikant",
        "ru.lex.prof.podrabotka",
        "ru.lex.prof.sovmestitelstvo",
        "ru.sent.b2.u604",
        "ru.lex.everyday.eto",
        "ru.lex.everyday.dom",
