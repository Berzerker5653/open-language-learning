goal_id: "ru.goal.on-ramp.cyrillic"
title: "Teaching stress mark and cumulative symbol review"
summary: "Learn the combining acute accent by attaching it to a taught vowel. Review every printed case form and contrast Е/Ё, И/Й and Ь/Ъ. Copy a marked vowel; no new word or audio task is introduced."
