id: "ru.unit.on-ramp.cyrillic-ts-ch-sh"
goal_id: "ru.goal.on-ramp.cyrillic"
title: "Printed Cyrillic: Ц ц, Ч ч, Ш ш"
summary: "Meet these printed letters. Each letter is one sound — see its printed forms, learn its name and sound, then recognize it and write it."
estimated_minutes: 5
activities:
  - id: "ru.activity.on-ramp.cyrillic-ts-ch-sh-read"
    type: "encounter-read"
    modality: "reading"
    support_level: 1
    content_refs:
      [
        "ru.orth.cyrillic.ts",
        "ru.orth.cyrillic.ch",
        "ru.orth.cyrillic.sh",
      ]
  - id: "ru.activity.on-ramp.cyrillic-ts-ch-sh-recognize"
    type: "recall"
    modality: "reading"
    support_level: 0
    content_refs:
      [
        "ru.orth.cyrillic.ts",
        "ru.orth.cyrillic.ch",
        "ru.orth.cyrillic.sh",
      ]
  - id: "ru.activity.on-ramp.cyrillic-ts-ch-sh-copy"
    type: "recall"
    modality: "writing"
    support_level: 1
    content_refs:
      [
        "ru.orth.cyrillic.ts",
        "ru.orth.cyrillic.ch",
        "ru.orth.cyrillic.sh",
      ]
  - id: "ru.activity.on-ramp.cyrillic-ts-ch-sh-discriminate"
    type: "listen-and-choose"
    modality: "listening"
    support_level: 1
    content_refs: [ "ru.contrast.voicing.zhsh" ]
generation_contract:
  allowed_vocab:
    [
      "ru.orth.cyrillic.ts",
      "ru.orth.cyrillic.ch",
      "ru.orth.cyrillic.sh",
      "ru.contrast.voicing.zhsh",
    ]
  allowed_grammar: []
  new_item_budget: 0
  register: []
  expected_interpretations: ["Recognition and copying of the exact requested Cyrillic symbol."]
  prohibited_ambiguity: ["Reject a Latin lookalike or the wrong case."]
  target_proficiency: "on-ramp"
  validation_method: "exact-match"
