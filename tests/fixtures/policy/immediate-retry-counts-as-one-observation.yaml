name: immediate-retry-counts-as-one-observation
notes: >
  docs/03 §5 / policy `attempt_grouping`: an immediate retry inside one
  attempt group is one observation, not two. Two correct events in group
  `sess-1:task-1` therefore satisfy `introduced` only — retrying the same
  presented task cannot manufacture the two observations `supported`
  requires, even with two distinct prompt families.
