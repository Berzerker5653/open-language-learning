target_locale: "ja-JP"
id_prefix: "ja"
mode: "B"
phase: 0
approval_status: "pending-owner-scope"

scope:
  plan_type: "extension"
  modalities: ["listening", "speaking", "reading", "writing"]
  delivered_baseline: "31 units (000-061), 20 goals, 211 lexicon entries, 61 sentences, 15 grammar concepts, 147 kana symbol records, 57 kanji entries; all gates 7/7."
  budget_semantics: "lexicon budgets are cumulative NEW words introduced by this plan; the 211 already-delivered words are not counted."
  content_basis: "Original AI-drafted instructional content, requiring dictionary sourcing and human review."
  kanji_staging: "kanji/entries.jsonl grows with the bands: A1 completion +60 (to ~117), A2 +150, B1 +450, B2 +1000 cumulative reading targets; kanji introduced only after kana and alongside taught vocabulary."
  romaji_policy: "Romaji only in readings where the existing pack already uses it; forms stay in kana/kanji."
  pitch_accent: "Deferred; marked for human review, not taught in this plan."
  delivery_risk: "Batches are append-only for JSONL shards; goals.yaml re-emitted in full."

sequence:
  ordering_rule: "Learning order follows prerequisites and the sequence below, not filename sorting."
  clusters:
    - { band: "A1", blocks: "062-118", purpose: "remaining A1 units" }
    - { band: "A2", blocks: "120-219", purpose: "remaining A2 units" }
    - { band: "B1", blocks: "220-414", purpose: "remaining B1 units" }
    - { band: "B2", blocks: "420-807", purpose: "remaining B2 units" }

unit_design:
  total_units: 740
  ordinary_new_item_budget: 6
  new_lexical_entries_per_ordinary_unit: 5
  additional_record_rule: "Introduce one grammar concept OR one sentence, never both in the same ordinary unit."
  counting_rule: "Newly introduced lexical, grammar, and sentence records only; reused records do not count."
  planned_record_totals:
    new_lexical_entries: 6656
    new_grammar_concepts: 67
    new_sentence_records: 570
    new_goals: 54

