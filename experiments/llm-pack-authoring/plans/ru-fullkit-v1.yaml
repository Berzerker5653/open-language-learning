            goal: "ru.goal.on-ramp.cyrillic",
          }
        - {
            file: "019-cyrillic-stress-review.yaml",
            topic: "Teaching stress mark and cumulative symbol recognition",
            goal: "ru.goal.on-ramp.cyrillic",
          }

  A1:
    - block: "020-029"
      topic: "Personal profiles and contact details"
      goal: "ru.goal.a1.personal-details"
      files:
        [
          020-personal-details-01.yaml,
          021-personal-details-02.yaml,
          022-personal-details-03.yaml,
          023-personal-details-04.yaml,
          024-personal-details-05.yaml,
          025-personal-details-06.yaml,
          026-personal-details-07.yaml,
          027-personal-details-08.yaml,
          028-personal-details-09.yaml,
          029-personal-details-10.yaml,
        ]

    - block: "030-039"
      topic: "People, family, and possessions"
      goal: "ru.goal.a1.people-family"
      files:
        [
          030-people-family-01.yaml,
          031-people-family-02.yaml,
          032-people-family-03.yaml,
          033-people-family-04.yaml,
          034-people-family-05.yaml,
          035-people-family-06.yaml,
          036-people-family-07.yaml,
          037-people-family-08.yaml,
          038-people-family-09.yaml,
          039-people-family-10.yaml,
        ]

