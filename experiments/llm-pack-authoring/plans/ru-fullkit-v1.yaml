target_locale: "ru-RU"
id_prefix: "ru"
mode: "B"
phase: 0
approval_status: "pending"

scope:
  modalities: ["reading", "writing"]
  planned_capabilities:
    listening: false
    speaking: false
    reading: true
    writing: true
  band_interpretation: "A text-based curriculum through B2; not a claim of assessed listening, speaking, or certified CEFR attainment."
  content_basis: "Original AI-drafted instructional content, requiring dictionary sourcing and human review."
  extended_texts: "Original instructional texts built from coherent sequences of sentence records, without invented real-world attribution."
  delivery_risk: "Later-band batches may exceed a single response once complete touched-file re-emission is included. This remains a delivery constraint for human review."

sequence:
  ordering_rule: "Learning order follows prerequisites and the sequence below, not filename sorting."
  clusters:
    - {
        band: "on-ramp",
        blocks: "010-019",
        purpose: "Printed Cyrillic and the teaching stress mark",
      }
    - { band: "on-ramp", blocks: "000-009", purpose: "First words and short written messages" }
    - { band: "A1", blocks: "020-109", purpose: "Basic everyday written communication" }
    - { band: "A2", blocks: "110-209", purpose: "Connected routine written communication" }
    - { band: "B1", blocks: "210-409", purpose: "Independent connected reading and writing" }
    - { band: "B2", blocks: "410-809", purpose: "Extended, nuanced reading and writing" }

unit_design:
  total_units: 810
  ordinary_units: 800
  script_units: 10
  ordinary_new_item_budget: 6
  new_lexical_entries_per_ordinary_unit: 5
  additional_new_records_per_ordinary_unit: 1
  additional_record_rule: "Introduce one grammar concept OR one sentence, never both in the same ordinary unit."
  counting_rule: "The six-item ceiling counts newly introduced lexical, grammar, and sentence learning records; reused records do not count again."
  script_new_item_budget: 0
  script_validation_method: "exact-match"
  grammar_sequence: "Introduce each concept before the first activity that requires it."
  recycling: "Reuse previously introduced vocabulary, grammar, and sentences for retrieval, cloze work, and cumulative practice."
  passage_construction: "Combine coherent sentence sequences in later reading activities using explicit ordered content references."
  assessment_plan:
    minimum_per_goal: 2
    reading: "Recognition, recall, or transfer appropriate to the goal."
    writing: "Production or transfer appropriate to the goal."
    script: "Separate recognition and copying or typing checks."
    later_bands: "Include extended responses, interpretation, synthesis, and revision using taught resources."
  planned_record_totals:
    lexical_entries: 4000
    grammar_concepts: 83
    sentence_records: 717
    orthography_records: 67
    goals: 45
    minimum_assessments: 90

prerequisite_templates:
  script_ready: &script-ready
    target: "ru.goal.on-ramp.cyrillic"
    dimension: "orthography-recognition"
    required_state: "independent"
    strength: "hard"

bands:
  on-ramp:
    unit_count: 20
    goals:
      - id: "ru.goal.on-ramp.cyrillic"
        can_do: "Recognize and copy all printed Cyrillic letter case forms and interpret the teaching stress mark."
        prerequisites: []
      - id: "ru.goal.on-ramp.greetings"
        can_do: "Read and write taught greetings, farewells, and polite responses in short text exchanges."
        prerequisites: [*script-ready]
      - id: "ru.goal.on-ramp.self-introduction"
        can_do: "Read and write a name and a minimal self-introduction using taught patterns."
        prerequisites: [*script-ready]
      - id: "ru.goal.on-ramp.classroom"
        can_do: "Recognize essential written learning instructions and use taught clarification requests."
        prerequisites: [*script-ready]
      - id: "ru.goal.on-ramp.everyday"
        can_do: "Identify familiar people and objects in short written identification statements."
        prerequisites: [*script-ready]
      - id: "ru.goal.on-ramp.numbers"
        can_do: "Match and write the number words zero through nine and their digits."
        prerequisites: [*script-ready]

  A1:
    unit_count: 90
    goals:
      - id: "ru.goal.a1.personal-details"
        can_do: "Read and complete simple personal profiles with names, origin, age, and contact details."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.on-ramp.self-introduction",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a1.people-family"
        can_do: "Read and write basic descriptions of people, family relationships, and possessions."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.personal-details",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a1.home"
        can_do: "Describe a home and locate familiar objects using short written sentences."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.people-family",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a1.routines"
        can_do: "Read and write about everyday routines, frequency, and simple recent or planned activities."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.personal-details",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a1.food"
        can_do: "Understand a simple menu and write basic food preferences and order requests."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.routines",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a1.shopping"
        can_do: "Read prices and product descriptions and write simple purchase requests."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.personal-details",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.a1.food",
              dimension: "pragmatic-use",
              required_state: "independent",
              strength: "helpful",
            }
      - id: "ru.goal.a1.city"
        can_do: "Understand basic place descriptions and write simple location and route information."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.home",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a1.time-plans"
        can_do: "Read and write times, dates, schedules, and basic plans."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.on-ramp.numbers",
              dimension: "recall-meaning",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.a1.routines",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a1.basic-messages"
        can_do: "Exchange brief written invitations, arrangements, and everyday messages."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.time-plans",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }

  A2:
    unit_count: 100
    goals:
      - id: "ru.goal.a2.past-events"
        can_do: "Write a connected account of familiar past events with a clear time sequence."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.routines",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a2.travel"
        can_do: "Read routine travel information and write booking, itinerary, and transport messages."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.city",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.a1.time-plans",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a2.services"
        can_do: "Understand routine service information and write requests for common transactions."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.shopping",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a2.wellbeing"
        can_do: "Read everyday wellbeing information and write simple descriptions of symptoms, needs, and appointments."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.personal-details",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a2.work-study"
        can_do: "Describe familiar work or study duties, experience, and immediate goals in writing."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.routines",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a2.social-plans"
        can_do: "Exchange written invitations, suggestions, acceptances, refusals, and arrangements."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.basic-messages",
              dimension: "pragmatic-use",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a2.comparisons"
        can_do: "Compare familiar people, products, places, and options and state simple reasons."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.people-family",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a2.instructions"
        can_do: "Understand and write short practical instructions in a clear sequence."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a1.routines",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a2.problems-solutions"
        can_do: "Explain a familiar practical problem in writing and request or suggest a solution."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.services",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.a2.past-events",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.a2.connected-messages"
        can_do: "Write connected personal messages using taught links, descriptions, and event sequences."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.past-events",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.a2.social-plans",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }

  B1:
    unit_count: 200
    goals:
      - id: "ru.goal.b1.narration"
        can_do: "Write connected narratives that distinguish background, main events, and outcomes."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.past-events",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b1.experiences"
        can_do: "Describe experiences, reactions, and lessons learned in connected written accounts."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.travel",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.b1.narration",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b1.practical-problems"
        can_do: "Handle less predictable everyday problems through clear explanatory correspondence."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.problems-solutions",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b1.learning-work"
        can_do: "Write about learning and work processes, experience, aims, and practical decisions."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.work-study",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b1.relationships"
        can_do: "Explain relationships, feelings, expectations, and misunderstandings in personal correspondence."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.social-plans",
              dimension: "pragmatic-use",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b1.culture-media"
        can_do: "Understand accessible cultural and media texts and write a reasoned personal response."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.connected-messages",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b1.opinions"
        can_do: "Develop an opinion in writing with reasons, examples, and respectful responses to alternatives."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.comparisons",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b1.information-summary"
        can_do: "Identify main points in straightforward informational texts and summarize them in writing."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.connected-messages",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b1.future-conditions"
        can_do: "Explain plans, consequences, possibilities, and hypothetical choices in writing."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.a2.social-plans",
              dimension: "grammar-controlled",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b1.extended-writing"
        can_do: "Produce organized longer personal and practical texts with coherent paragraphs and appropriate endings."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b1.narration",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.b1.information-summary",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }

  B2:
    unit_count: 400
    goals:
      - id: "ru.goal.b2.argumentation"
        can_do: "Write a sustained argument with a clear position, supporting evidence, qualifications, and counterarguments."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b1.opinions",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.b1.extended-writing",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b2.critical-reading"
        can_do: "Analyze how a complex text organizes claims, signals stance, and distinguishes evidence from inference."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b1.information-summary",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b2.synthesis"
        can_do: "Compare and synthesize information from multiple supplied texts with accurate attribution and paraphrase."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b1.extended-writing",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.b2.critical-reading",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b2.academic-study"
        can_do: "Read study-oriented texts and write structured notes, explanations, and findings summaries."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b2.synthesis",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b2.professional-writing"
        can_do: "Write clear professional correspondence, proposals, process descriptions, and applications."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b1.learning-work",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.b1.extended-writing",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b2.negotiation"
        can_do: "Negotiate requests, competing priorities, and compromises through sustained written exchanges."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b1.practical-problems",
              dimension: "pragmatic-use",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.b1.opinions",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b2.society-policy"
        can_do: "Compare social and public-policy options in writing using balanced reasoning and clearly stated trade-offs."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b2.argumentation",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b2.science-environment"
        can_do: "Explain supplied scientific, technological, and environmental information while preserving uncertainty and limits."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b2.critical-reading",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b2.culture-perspectives"
        can_do: "Interpret cultural texts and compare perspectives without treating generalizations as universal facts."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b1.culture-media",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.b2.critical-reading",
              dimension: "comprehension-reading",
              required_state: "independent",
              strength: "hard",
            }
      - id: "ru.goal.b2.style-register"
        can_do: "Revise extended texts for precision, cohesion, grammatical control, and an appropriate written register."
        prerequisites:
          - *script-ready
          - {
              target: "ru.goal.b2.professional-writing",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }
          - {
              target: "ru.goal.b2.synthesis",
              dimension: "production-writing",
              required_state: "independent",
              strength: "hard",
            }

units:
  base_directory: "curriculum/units"
  file_metadata_rule: "Every filename in a files list is a separate unit with the enclosing topic and goal. All filenames are relative to base_directory."
  ordinary_unit_rule: "Every non-script file introduces five lexical entries and one grammar or sentence record."
  suffix_rule: "Numbered suffixes identify distinct successive micro-lessons, not alternative filenames."

  on-ramp:
    - block: "000-009"
      new_item_budget: 6
      lessons:
        - {
            file: "000-greetings-01.yaml",
            topic: "First polite greetings",
            goal: "ru.goal.on-ramp.greetings",
          }
        - {
            file: "001-greetings-02.yaml",
            topic: "Farewells and polite responses",
            goal: "ru.goal.on-ramp.greetings",
          }
        - {
            file: "002-self-introduction-01.yaml",
            topic: "Names and personal reference",
            goal: "ru.goal.on-ramp.self-introduction",
          }
        - {
            file: "003-self-introduction-02.yaml",
            topic: "Minimal written introductions",
            goal: "ru.goal.on-ramp.self-introduction",
          }
        - {
            file: "004-classroom-01.yaml",
            topic: "Essential written learning instructions",
            goal: "ru.goal.on-ramp.classroom",
          }
        - {
            file: "005-classroom-02.yaml",
            topic: "Taught clarification requests",
            goal: "ru.goal.on-ramp.classroom",
          }
        - {
            file: "006-everyday-01.yaml",
            topic: "Familiar people and objects",
            goal: "ru.goal.on-ramp.everyday",
          }
        - {
            file: "007-everyday-02.yaml",
            topic: "Simple written identification",
            goal: "ru.goal.on-ramp.everyday",
          }
        - {
            file: "008-numbers-01.yaml",
            topic: "Number words zero through four",
            goal: "ru.goal.on-ramp.numbers",
          }
        - {
            file: "009-numbers-02.yaml",
            topic: "Number words five through nine",
            goal: "ru.goal.on-ramp.numbers",
          }

    - block: "010-019"
      new_item_budget: 0
      validation_method: "exact-match"
      lessons:
        - {
            file: "010-cyrillic-a-o-m-t.yaml",
            topic: "Printed case pairs А а, О о, М м, Т т",
            goal: "ru.goal.on-ramp.cyrillic",
          }
        - {
            file: "011-cyrillic-k-e-n-s.yaml",
            topic: "Printed case pairs К к, Е е, Н н, С с",
            goal: "ru.goal.on-ramp.cyrillic",
          }
        - {
            file: "012-cyrillic-r-v-u-kh.yaml",
            topic: "Printed case pairs Р р, В в, У у, Х х",
            goal: "ru.goal.on-ramp.cyrillic",
          }
        - {
            file: "013-cyrillic-b-p-d-g.yaml",
            topic: "Printed case pairs Б б, П п, Д д, Г г",
            goal: "ru.goal.on-ramp.cyrillic",
          }
        - {
            file: "014-cyrillic-l-z-zh-i.yaml",
            topic: "Printed case pairs Л л, З з, Ж ж, И и",
            goal: "ru.goal.on-ramp.cyrillic",
          }
        - {
            file: "015-cyrillic-y-short-i-yo-yu.yaml",
            topic: "Printed case pairs Ы ы, Й й, Ё ё, Ю ю",
            goal: "ru.goal.on-ramp.cyrillic",
          }
        - {
            file: "016-cyrillic-ya-eh-f.yaml",
            topic: "Printed case pairs Я я, Э э, Ф ф",
            goal: "ru.goal.on-ramp.cyrillic",
          }
        - {
