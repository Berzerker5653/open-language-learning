grammar:
  file: "grammar/concepts.jsonl"
  introduction_policy: "Each listed concept occupies the single additional-record slot of an ordinary unit before dependent use."
  later_practice: "Previously introduced concepts recur without receiving replacement IDs."

  on-ramp:
    new_concepts: 3
    cumulative_concepts: 3
    concepts:
      ru.grammar.on-ramp.formulaic-politeness: "Fixed polite messages as whole expressions; no productive verb rule inferred."
      ru.grammar.on-ramp.zero-present-copula: "Simple present-tense nominal identification without an overt copula."
      ru.grammar.on-ramp.eto-identification: "Basic identification with это and a nominative noun."

  A1:
    new_concepts: 20
    cumulative_concepts: 23
    concepts:
      ru.grammar.a1.subject-pronouns: "Subject pronouns and basic personal reference."
      ru.grammar.a1.noun-gender: "Basic noun gender patterns and taught exceptions."
      ru.grammar.a1.noun-number: "Nominative singular and plural forms."
      ru.grammar.a1.adjective-agreement: "Nominative adjective agreement with nouns."
      ru.grammar.a1.possessives: "Basic possessive forms and agreement."
      ru.grammar.a1.present-conjugation: "Present-tense verb forms in the two main conjugation patterns."
      ru.grammar.a1.questions: "Basic written yes-no and question-word patterns."
      ru.grammar.a1.negation: "Basic sentence and constituent negation with не."
      ru.grammar.a1.accusative-inanimate: "Direct objects with taught inanimate noun patterns."
      ru.grammar.a1.accusative-animate: "Basic direct-object patterns for taught animate nouns."
