lexicon:
  budget_basis: "Planning word budgets count distinct lexical entries, including taught fixed expressions. Inflected forms and reused entries are not counted again."
  shard_policy: "Topic shards persist across bands. A later addition to a shard retains all earlier records."
  recycling_policy: "Earlier shards remain available for explicitly declared reuse."
  native_forms: "Cyrillic"
  readings: "Cyrillic, with pedagogical stress marking where useful."
  gloss_locale: "en-US"

