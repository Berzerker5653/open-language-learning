id: "ru.unit.b1.writing-01"
goal_id: "ru.goal.b1.extended-writing"
title: "Request"
summary: "запрос, адресат, экземпляр, черновик and чистовик."
estimated_minutes: 8
activities:
  - id: "ru.activity.b1.u390-read"
    type: "encounter-read"
    modality: "reading"
    support_level: 1
    content_refs:
      &v [
        "ru.lex.writing.zapros",
        "ru.lex.writing.adresat",
        "ru.lex.writing.ekzemplyar",
        "ru.lex.writing.chernovik",
        "ru.lex.writing.chistovik",
        "ru.sent.b1.u390",
        "ru.lex.everyday.eto",
        "ru.lex.everyday.dom",
      ]
  - id: "ru.activity.b1.u390-grammar"
    type: "encounter-read"
    modality: "reading"
    support_level: 1
    content_refs:
      &g ["ru.grammar.on-ramp.eto-identification", "ru.grammar.on-ramp.zero-present-copula"]
  - id: "ru.activity.b1.u390-cloze"
    type: "cloze"
    modality: "writing"
    support_level: 1
    content_refs: ["ru.sent.b1.u390"]
  - id: "ru.activity.b1.u390-write"
    type: "recall"
    modality: "writing"
    support_level: 0
    content_refs: *v
generation_contract:
  allowed_vocab: *v
  allowed_grammar: *g
  new_item_budget: 6
  register: []
  expected_interpretations: ["Request: letter with taught forms only."]
  prohibited_ambiguity: ["Do not confuse черновик (draft) with чистовик (final copy)."]
  target_proficiency: "B1"
  validation_method: "choice"
