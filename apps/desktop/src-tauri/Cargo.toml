[package]
name = "lts-desktop"
description = "Tauri 2 native shell hosting the shared web UI (BOOT-002)."
version = "0.4.3-alpha.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "lts_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# BUILD-DEFAULT-CP-001: embedding is the DEFAULT — a plain
# `cargo build --release -p lts-desktop` bundles `frontendDist` instead of
# pointing the webview at the dev server (owner dogfood: the old opt-in shape
# produced a first-screen "Could not connect to 127.0.0.1:1420").
# `tauri dev` stays dev-mode by itself: the tauri CLI (interface/rust.rs
# `dev_options`) passes `--no-default-features` and re-enables every default
# feature except ones mapping to `tauri/custom-protocol`. Cargo calls that
# compile this crate WITHOUT a built `apps/desktop/dist` (gitignored;
# tauri-build panics on missing frontendDist when embedding is on) must pass
# `--no-default-features` — as the CI rust-static/rust-test jobs and the
# preview/smoke fallbacks now do.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# WEB-SERVE-001: HTTP serve mode (the `lts-serve` binary). Opt-in so the
# desktop shell build never carries the HTTP stack; the serve mode reuses
# the SAME command wiring (wire_commands), driven through Tauri's own IPC
# layer on a mock runtime — no command logic is duplicated.
serve = ["dep:axum", "dep:tokio", "dep:futures-core", "tauri/test"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde.workspace = true
serde_json.workspace = true
lts-domain.workspace = true
lts-langpack.workspace = true
lts-storage.workspace = true
lts-scheduler.workspace = true
lts-learner-model.workspace = true
serde_yaml.workspace = true
lts-activity.workspace = true
lts-world.workspace = true
lts-speech-api.workspace = true
lts-speech-runtime.workspace = true
uuid.workspace = true
base64 = "0.22"
sha2 = "0.10"
ureq = "2.10"
url = "2.5"
zip.workspace = true
tauri-plugin-single-instance = "2.4.5"
# WEB-SERVE-001 (feature-gated `serve`): the HTTP bridge stack, never
# compiled into the desktop shell.
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
# WEB-PROGRESS-001: the Stream trait for the SSE progress-event bridge.
futures-core = { version = "0.3", optional = true }

[[bin]]
name = "lts-serve"
path = "src/bin/lts-serve.rs"
required-features = ["serve"]

[target.'cfg(unix)'.dependencies]
# Free-space preflight for pack installs (statvfs). Windows keeps compiling
# without it: `free_bytes` there answers `None` and the check is skipped.
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
# WEB-SERVE-001: drive the serve router in-process (oneshot) in tests.
tower = { version = "0.5", features = ["util"] }
# WEB-PROGRESS-001: read streaming SSE response bodies in tests (BodyExt).
http-body-util = "0.1"
