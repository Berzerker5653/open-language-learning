[package]
name = "lts-desktop"
description = "Tauri 2 native shell hosting the shared web UI (BOOT-002)."
version = "0.4.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "lts_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Smoke/release builds embed `frontendDist` instead of loading the dev
# server URL; `cargo build -p lts-desktop --features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde.workspace = true
serde_json.workspace = true
lts-domain.workspace = true
lts-langpack.workspace = true
lts-storage.workspace = true
lts-scheduler.workspace = true
lts-learner-model.workspace = true
serde_yaml.workspace = true
lts-activity.workspace = true
lts-world.workspace = true
lts-speech-api.workspace = true
lts-speech-runtime.workspace = true
uuid.workspace = true
base64 = "0.22"
sha2 = "0.10"
ureq = "2.10"
url = "2.5"
zip.workspace = true
tauri-plugin-single-instance = "2.4.5"

[dev-dependencies]
tempfile.workspace = true
