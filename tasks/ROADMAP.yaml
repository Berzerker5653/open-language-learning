  - Dictation plays target audio (media-first, model-output labeled) and grades typed transcription on a dedicated `orthographic-encoding` dimension; it never grants production-writing evidence (MASTERY_POLICY lists dictation-of-target as disqualifying for that dimension).
- id: K-13
  milestone: M6
  priority: P2
