- id: K-12
  milestone: M6
  priority: P2
  title: Cloze + dictation activities (typed recall, guessing resistance)
  dependencies:
  - TTS-001
  read_first:
  - docs/03_CURRICULUM_AND_MASTERY.md
  - docs/assessment/MASTERY_POLICY.yaml
  acceptance:
