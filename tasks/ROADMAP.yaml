- id: REVIEW-001
  milestone: M3
  priority: P0
  title: Define finite Japanese coverage and qualified review gates
  dependencies:
  - JA-RES-001
  - JA-RES-004
  - JA-RES-005
  - LEARN-005
  read_first:
  - docs/06_JAPANESE_REFERENCE.md
  - docs/09_TESTING_AND_ACCEPTANCE.md
  - docs/16_CONTENT_AUTHORING_AND_REVIEW.md
  - docs/18_PUBLIC_CLAIMS_AND_SCOPE.md
  acceptance:
  - languages/ja-JP/review/REVIEW_POLICY.yaml defines reviewer qualifications by review type, review records,
    disagreements, critical fixes, coverage percentages, sampling boundaries, and promotion authority.
  - docs/assessment/RELEASE_COVERAGE.yaml enumerates a finite A1/A2/B1/B2 capability map with framework edition/descriptors,
    modalities, linked prerequisites, assessments, transfer/retention rubrics, and review evidence.
  - All scored targets, core reused instruction, answer variants, and reference pronunciation targets require
    qualified human review before reference release; sampled lower-risk practice is separated and risk is disclosed.
  - Missing reviewer capacity or source rights is recorded as an explicit blocker without self-certifying content
    or contacting third parties without owner authorization.
  - The coverage map is agreed and versioned before bulk authoring; narrowing mandatory objectives to make
    gates pass is a scope decision requiring owner approval.
  required_for_desktop_1_0: true
