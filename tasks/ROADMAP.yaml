schema_version: '1.0'
project: open-language-learning-platform
selection_policy: eligible required task in lowest numbered milestone, then priority order, then stable task
  ID; dependencies must be done; optional work needs explicit owner scope
status_values:
- blocked
- ready
- in_progress
- review
- done
- retryable
priorities:
- P0
- P1
- P2
- P3
milestones:
- id: M0
  name: Bootstrap and technical proof
- id: M1
  name: Language Pack SDK and secure content core
- id: M2
  name: Learner model, scheduler, and persistence
- id: M3
  name: Japanese research foundation
- id: M4
  name: First playable learning vertical slice
- id: M5
  name: Local speech and pronunciation foundation
- id: M6
  name: Japanese A1-quality course
- id: M7
  name: Scenario/game expansion and A2
- id: M8
  name: Independent learner / B1
- id: M9
  name: B2 reference release coverage
- id: M10
  name: Cross-platform, audit, and 1.0 release
- id: M11
  name: Advanced/C1-C2-capable continuation
