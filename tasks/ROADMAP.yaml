- id: PACK-UPDATE-UX-001
  milestone: M10
  priority: P2
  title: A newer catalogue version of an installed pack is offered as an update
  dependencies:
  - PACK-DL-ALLOWLIST-001
  read_first:
  - apps/desktop/src/App.tsx
  - apps/desktop/src/language.tsx
  - apps/desktop/src-tauri/src/packs.rs
  - catalog/packs.json
  - state/evidence/RC-0.4.1-2026-10-15/publication-2026-10-16.md
  - state/evidence/RC-0.4.2-2026-10-18/publication-2026-10-18.md
  acceptance:
  - >-
    Corrected 2026-10-16 against the code: the affordance exists but is hidden.
    `apps/desktop/src-tauri/src/packs.rs:238-241` fills `installed_version` per catalogue row and
    `apps/desktop/src/language.tsx:419-429` renders `Update to v{version}` when it differs from the
    pin (`language.test.tsx:115`). The gap is discovery and the wizard: `installed_version` has one
    consumer in `apps/desktop/src`, and `App.tsx:266,842` keep `installedPacks` as pack ids, so
    `onboarding.tsx:95,200,205` treat any installed version as satisfying the row. The first
    criterion is that a learner who never opens the pack panel is told an update exists, and that
    onboarding states the installed version next to the pinned one.
  - >-
    The update re-verifies against the new pin before it activates and keeps the previous version in
    the store for rollback, the invariant already pinned by `crates/langpack/tests/media_upgrade.rs`.
  - >-
    A test covers the version-aware state (installed 0.4.0 + catalogue 0.4.1 yields an update state,
    not "installed"/nothing), so the behaviour cannot silently regress to id-only matching.
  - >-
    No learner-facing string names a ticket, ADR or version-migration detail; `tools/audit_learner_copy.py`
    stays at 0 findings.
  required_for_desktop_1_0: false
