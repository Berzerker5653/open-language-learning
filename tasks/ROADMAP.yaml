schema_version: '1.0'
project: open-language-learning-platform
selection_policy: eligible required task in lowest numbered milestone, then priority order, then stable task
  ID; dependencies must be done; optional work needs explicit owner scope
status_values:
- blocked
- ready
- in_progress
- review
- done
- retryable
priorities:
- P0
- P1
- P2
- P3
milestones:
- id: M0
  name: Bootstrap and technical proof
- id: M1
  name: Language Pack SDK and secure content core
- id: M2
  name: Learner model, scheduler, and persistence
- id: M3
  name: Japanese research foundation
- id: M4
  name: First playable learning vertical slice
- id: M5
  name: Local speech and pronunciation foundation
- id: M6
  name: Japanese A1-quality course
- id: M7
  name: Scenario/game expansion and A2
- id: M8
  name: Independent learner / B1
- id: M9
  name: B2 reference release coverage
- id: M10
  name: Cross-platform, audit, and 1.0 release
- id: M11
  name: Advanced/C1-C2-capable continuation
tasks:
- id: ARCH-001
  milestone: M0
  priority: P0
  title: Define core domain IDs, versions, and provider interfaces
  dependencies:
  - BOOT-001
  read_first:
  - docs/03_CURRICULUM_AND_MASTERY.md
  - docs/04_LANGUAGE_PACK_SPEC.md
  - docs/05_SPEECH_SYSTEM.md
  - docs/07_TECHNICAL_ARCHITECTURE.md
  - docs/08_DATA_AND_PRIVACY.md
  acceptance:
  - Typed stable ID/version primitives exist.
  - Speech/provider interfaces compile without concrete provider dependency.
  - Language pack domain model has no ja-JP dependency.
  required_for_desktop_1_0: true
- id: BOOT-001
  milestone: M0
  priority: P0
  title: Initialize monorepo and toolchains
  dependencies: []
  read_first:
  - docs/00_MASTER_SPEC.md
  - docs/07_TECHNICAL_ARCHITECTURE.md
  - docs/15_AUTONOMOUS_DEVELOPMENT.md
  - docs/19_PROJECT_FILE_ARCHITECTURE.md
  acceptance:
  - Clean checkout installs/builds with documented commands on Linux reference environment.
  - Pinned lockfiles and workspace layout exist for app/packages/crates.
  - CI executes formatting, typecheck, unit-test placeholders, and schema checks.
  - ADR records final initial stack and current stable versions.
  required_for_desktop_1_0: true
- id: BOOT-002
  milestone: M0
  priority: P0
  title: Create Tauri desktop shell and shared UI skeleton
  dependencies:
  - BOOT-001
  read_first:
  - docs/01_PRODUCT_AND_UX.md
  - docs/07_TECHNICAL_ARCHITECTURE.md
  - docs/11_ACCESSIBILITY_AND_LOCALIZATION.md
  acceptance:
  - Desktop app launches and renders a keyboard-navigable shell.
  - UI layer has no Japanese-specific hardcoding in core components.
  - Automated smoke test covers launch/home route.
  required_for_desktop_1_0: true
- id: BOOT-003
  milestone: M0
  priority: P0
  title: Establish quality, lint, CI, and ADR conventions
  dependencies:
  - BOOT-001
  read_first:
  - AGENTS.md
  - docs/09_TESTING_AND_ACCEPTANCE.md
  acceptance:
  - Formatting/lint/type/test commands are documented and CI-enforced.
  - Test fixture and ADR conventions are documented.
  - Secret scanning and dependency audit baseline are enabled where practical.
  required_for_desktop_1_0: true
- id: PERF-001
  milestone: M0
  priority: P1
  title: Specify supported hardware and performance test contract
  dependencies:
  - BOOT-002
  - ARCH-001
  read_first:
  - docs/05_SPEECH_SYSTEM.md
  - docs/07_TECHNICAL_ARCHITECTURE.md
  - docs/17_SPEECH_BENCHMARK_PLAN.md
  acceptance:
  - docs/performance/BUDGETS.yaml defines named OS/hardware tiers, sample lengths, warm/cold scenarios, latency
    percentiles, memory/disk limits, cancellation, and UI responsiveness measurement.
  - Provisional budgets are labeled product targets and frozen after baseline spikes, before optimizing providers
    or running release measurements; actual hardware/model combinations are identified.
  - Support may be narrowed transparently with compatible alternatives, but thresholds cannot be raised silently
    to make a failed configuration pass.
  required_for_desktop_1_0: true
- id: LIC-001
  milestone: M1
  priority: P1
  title: Resolve distribution licenses and component rights
  dependencies:
  - PACK-003
  read_first:
  - docs/10_LICENSING_AND_PROVENANCE.md
  - docs/13_RELEASE_AND_DISTRIBUTION.md
  - docs/SOURCES.md
  acceptance:
  - Record an owner-approved source-code license and original-content license before public redistribution;
    include final license files only after compatibility checks.
  - Application, original curriculum, imported dictionary derivatives, models/voices, media/fonts, and benchmark
    datasets each have an auditable rights/attribution record.
  - Access/use conditions are tracked separately from copyright license; restricted research fixtures are fetched
    permissionably and are not re-hosted.
  - Local implementation and alternative-source research may continue while any owner-only licensing choice
    is pending; release remains blocked.
  required_for_desktop_1_0: true
- id: PACK-001
  milestone: M1
  priority: P0
  title: Implement and complete public pack schemas and structural validator
  dependencies:
  - ARCH-001
  - BOOT-003
  read_first:
  - docs/04_LANGUAGE_PACK_SPEC.md
  - schemas/README.md
  acceptance:
  - Minimal and Japanese draft manifests parse and validate.
  - Malformed fixtures fail with actionable diagnostics.
  - CLI has machine-readable JSON output.
  - Publish schemas and conformance fixtures for every shipped logical content type including lexical entries,
    scripts, phonology, pragmatics, scenarios, assessments, review and provenance records; seed schemas are
    provisional.
  - Stable ID grammar is consistent across docs and schemas, locale/script and engine SemVer compatibility
    is checked semantically, and content generation/review provenance is representable.
  - Every draft unresolved reference is explicit and rejects normal pack build/promotion; handoff scaffold
    validation never confers installation or release eligibility.
  - Evolve bare prerequisite IDs into versioned target/modality/dimension/state/hard-or-helpful records as
    defined in docs/03, with migration and fixtures for deferred-modality tracks; the starter goal schema does
    not yet implement this contract.
  required_for_desktop_1_0: true
- id: PACK-002
  milestone: M1
  priority: P0
  title: Implement cross-file ID and curriculum graph validator
  dependencies:
  - PACK-001
  read_first:
  - docs/03_CURRICULUM_AND_MASTERY.md
  - docs/04_LANGUAGE_PACK_SPEC.md
  acceptance:
  - Unknown references and duplicate IDs fail.
  - Prerequisite cycles fail with cycle path.
  - Unreachable/dead goal audit report is generated.
  required_for_desktop_1_0: true
- id: PACK-003
  milestone: M1
  priority: P0
  title: Implement source/license audit
  dependencies:
  - PACK-001
  read_first:
  - docs/10_LICENSING_AND_PROVENANCE.md
  - docs/SOURCES.md
  - docs/16_CONTENT_AUTHORING_AND_REVIEW.md
  acceptance:
  - Reference builds fail on unknown/blocked redistributed assets.
  - Attribution report can be generated.
  - Reference-only sources cannot be marked as bundled assets.
  required_for_desktop_1_0: true
- id: PACK-004
  milestone: M1
  priority: P0
  title: Secure pack archive build/install/inspect
  dependencies:
  - PACK-001
  - PACK-002
  - PACK-003
  read_first:
  - docs/04_LANGUAGE_PACK_SPEC.md
  - docs/08_DATA_AND_PRIVACY.md
  acceptance:
  - Deterministic pack build produces hashes/manifest.
  - Installer rejects path traversal, invalid hashes, oversized/decompression-bomb fixtures.
  - Install/upgrade/rollback integration tests pass.
  required_for_desktop_1_0: true
- id: PACK-005
  milestone: M1
  priority: P1
  title: Complete langpack CLI author workflow
  dependencies:
  - PACK-004
  read_first:
  - docs/04_LANGUAGE_PACK_SPEC.md
  - docs/16_CONTENT_AUTHORING_AND_REVIEW.md
  acceptance:
  - init/validate/lint/test/audit-curriculum/audit-sources/audit-licenses/build/inspect commands exist.
  - Minimal pack can be initialized, validated, built, and inspected from clean temp directory.
  - Contributor quickstart is documented.
  required_for_desktop_1_0: true
- id: DATA-001
