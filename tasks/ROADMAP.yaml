  - docs/03_CURRICULUM_AND_MASTERY.md
  acceptance:
  - Planner supports 5/10/20/30+ minute budgets.
  - Balances due review, weak skills, progression, and modality repetition limits.
  - No streak/day-presence objective exists.
  - Plans are reproducible with fixed input/seed.
  required_for_desktop_1_0: true
- id: LEARN-005
  milestone: M2
  priority: P0
  title: Specify versioned mastery, assessment, and prerequisite policy
  dependencies:
  - LEARN-001
  - PACK-002
  read_first:
  - docs/03_CURRICULUM_AND_MASTERY.md
  - docs/09_TESTING_AND_ACCEPTANCE.md
  - docs/11_ACCESSIBILITY_AND_LOCALIZATION.md
  acceptance:
  - docs/assessment/MASTERY_POLICY.yaml specifies evidence eligibility, dimension transitions, support levels,
    diversity, delay, confidence, and modality-aware prerequisite evaluation with worked fixtures.
  - Policy marks thresholds as initial implementation hypotheses; memory scheduling does not supply a proficiency
    rubric.
  - Technical failures, abstention, skipped tasks, latency alone, and invalid content never create negative
    linguistic outcomes; elapsed-time memory decay is evaluated separately.
  - Tests cover no-microphone/no-audio tracks, novice and already-known material, supported success, content
    correction, repeated prompt memorization, and transfer/retention evidence.
  - Policy version is recorded with derived decisions and evidence interpretation; policy is frozen before
    LEARN-002 and revised only with documented evidence and migration impact.
  required_for_desktop_1_0: true
