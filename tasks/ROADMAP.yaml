  # acceptance text requires: desktop 1.0 ships guided-only pronunciation feedback,
  # so calibration data is no longer a release blocker. Re-enable by funding the
  # consented panel in benchmarks/speech/datasets/SOURCING.md; the protocol,
  # consent instrument and labeler rubric stay in the repo.
  # Dependency edges into ACC-001 / PERF-002 / PLAT-001 / SEC-001 / REL-001 were removed on
  # 2026-10-17 so the graph matches docs/00_MASTER_SPEC.md ("`SPEECH-007` is out of the required-for-
  # 1.0 chain until a consented panel exists") and ADR-0017 §2. The card stays live as optional work
  # in execution_scope.optional_tasks; shipped speech features are still gated by SPEECH-006.
  required_for_desktop_1_0: false
