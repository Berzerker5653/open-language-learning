  acceptance:
  - Packs declare stories (`stories/*.yaml`: ordered sentence content ids); the app renders an interlinear reader with per-sentence media-first audio and tap-to-lookup (sentence scaffolds + lexicon entries whose surface occurs in the sentence), scaffolds faded by comprehension-reading mastery via the READ-001 reader.
  - The mode is FORMATIVE input practice: it records no mastery evidence; grading means ordering sentences by learner-known content, not scoring.
