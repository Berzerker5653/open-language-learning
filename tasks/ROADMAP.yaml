- id: SPEECH-007
  milestone: M6
  priority: P0
  title: Calibrate and gate each automated speech feedback feature
  dependencies:
  - SPEECH-005
  - SPEECH-006
  - TTS-001
  - JA-A1-001
  read_first:
  - docs/05_SPEECH_SYSTEM.md
  - docs/09_TESTING_AND_ACCEPTANCE.md
  - docs/16_CONTENT_AUTHORING_AND_REVIEW.md
  - docs/17_SPEECH_BENCHMARK_PLAN.md
  acceptance:
  - Permissioned calibration artifacts follow the preregistered protocol in docs/17, with speaker/prompt-independent
    holdouts, label agreement, error rates, uncertainty intervals, and assessment coverage.
  - Each automatic feature is enabled only for validated provider/model/content/hardware/variant conditions;
    fallback remains guided or abstains outside this envelope.
  - Registry binds feature, confidence definition, thresholds, versions/hashes and evidence report; model/provider/policy
    changes invalidate eligibility until revalidation.
  - If any feature cannot meet frozen accuracy and coverage limits, it remains guided/reference and cannot
    generate automatic pronunciation mastery.
  - Stable desktop 1.0 requires at least one high-value Japanese pronunciation contrast to qualify for automatic
    feedback within a declared useful coverage envelope. If none meets the frozen gates, stable RC remains
    blocked; guided alpha/beta practice may continue and changing this target requires an explicit owner scope
    decision.
