      org: Electronic Dictionary Research and Development Group
      url: https://www.edrdg.org/wiki/JMdict-EDICT_Dictionary_Project.html
      license: CC BY-SA 4.0 (EDRDG dictionary licence)
      license_url: https://www.edrdg.org/edrdg/licence.html
      accessed: "2026-10-02"
      type: dictionary
      redistribution: derived
      attribution: >
        "JMdict/JMnedict © Electronic Dictionary Research and
        Development Group, CC BY-SA 4.0" plus modification notice
      notes: >
        Dictionary sourcing layer, not a mirror. Lexicon and kanji records cite
        this data via jmdict-simplified 3.6.2 for forms/readings/meanings; gloss
        wording is ai-drafted and no dictionary definition text is reproduced
        (docs/review/2026-10-05-external-pack-review.md). Share-alike attaches to
        the derived layer: `languages/ja-JP/licenses.jsonl` now carries
        `lic-lexicon-dictionary` and `lic-kanji-dictionary` at CC-BY-SA-4.0 with
        the EDRDG attribution (added 2026-10-13, when the pack README's claim of a
        dictionary-data record was found to be untrue). The pack-level
        content_license question (O-01(a)) was settled by the owner on
        2026-10-13: the manifest now declares CC-BY-SA-4.0.
    - id: kanjidic2
      title: KANJIDIC2 (kanji dictionary)
      org: EDRDG
      url: https://www.edrdg.org/wiki/index.php/KANJIDIC_Project
      license: CC BY-SA 4.0 (EDRDG dictionary licence)
      license_url: https://www.edrdg.org/edrdg/licence.html
      accessed: "2026-10-02"
      type: dictionary
      redistribution: derived
      attribution: KANJIDIC2 © EDRDG, CC BY-SA 4.0
      notes: >
        Listed as a research source; **not cited by any pack record** as of
        2026-10-13. Open provenance gap flagged for human review, not asserted
        here: the 84 `kanji/*.jsonl` entries carry `radicals`, `meanings` and
        `readings` whose per-record sources name only `jf-standard` and
        `jmdict-simplified`. If those fields were in fact taken from KANJIDIC2,
        the pack needs a matching `derived-from-source` record and attribution.
    - id: kradfile
      title: KRADFILE (kanji radical/decomposition data)
      org: EDRDG
      url: https://www.edrdg.org/wiki/index.php/KRADFILE
      license: CC BY-SA 4.0 (EDRDG dictionary licence)
      license_url: https://www.edrdg.org/edrdg/licence.html
      accessed: "2026-10-02"
      type: dictionary
      redistribution: derived
      attribution: KRADFILE © EDRDG, CC BY-SA 4.0
      notes: >
        Research source as of 2026-10-13 (not cited by any pack record then). The prepared
        O-07 option-A patch — NOT landed, see `state/evidence/O-07/` — changes that: it adds
        the pack `sources.jsonl` record `kradfile` and licence record `lic-kanji-radicals`,
        names `kradfile` in the per-record `sources` spans of all 84 `kanji/*.jsonl` rows, and
        replaces every `radicals` list with the KRADFILE element list (20 already byte-identical,
        7 same set in a different order, 57 changed). Licence verified 2026-10-15 at
        edrdg.org/edrdg/licence.html: CC BY-SA 4.0, §2 covers RADKFILE/KRADFILE and files
        derived from them, §3 requires an app-surface acknowledgement, §4 requires a data-refresh
        procedure. KRADFILE2/RADKFILE2 (JIS X 0212) are separately held by Jim Rose and unused.
    - id: unidic
      title: UniDic (morphological dictionary, NINJAL)
      org: NINJAL
      url: https://clrd.ninjal.ac.jp/unidic/en/
      license: triple GPL-2.0 / LGPL-2.1 / BSD-3-Clause (pick BSD)
      license_url: https://clrd.ninjal.ac.jp/unidic/en/
      accessed: "2026-10-02"
      type: dictionary/morphology
      redistribution: allowed
      attribution: UniDic © NINJAL under the selected BSD option
      notes: >
        Verified triple license on the official download page;
        BSD-3-Clause option makes bundling safe. Use for inflection
        tables and morphology, not as learner lexicon.
    - id: ipadic
      title: IPAdic (MeCab dictionary, incl. accent/prosody fields)
      org: NAIST (public via taku910/MeCab project)
      url: https://taku910.github.io/mecab/
      license: permissive NAIST/IPAdic license (MIT-like)
      license_url: https://wiki.debian.org/IpadicLicense
      accessed: "2026-10-02"
      type: dictionary/morphology
      redistribution: allowed
      attribution: preserve the IPAdic copyright notice
      notes: >
        License text is short and permissive; SPDX registration was
        proposed. Verify exact notice file in the shipped artifact.
    - id: waller-jlpt
      title: Waller JLPT word lists
      org: Jonathan Waller
      url: https://www.tanos.co.uk/jlpt/
      license: believed public-domain/CC0-class; not confirmed on page
      license_url: https://www.tanos.co.uk/jlpt/
      accessed: "2026-10-02"
      type: word list
      redistribution: unknown
      attribution: n/a until confirmed
      notes: widely redistributed but the source page lacks an
        explicit license statement.
      alternative: >
        jkindrix-jld (CC BY-SA 4.0 aggregation includes Waller) or
        frequency lists derived from UniDic/BCCWJ statistics
        (reference-only inputs, own output).

