      type: grammar reference
      redistribution: blocked
      attribution: n/a
      notes: >
        NC clause is incompatible with distributing a commercial-ish
        product; do not derive pack text from it.
      alternative: >
        jkindrix/japanese-language-data grammar layer (CC BY-SA 4.0)
        and project-authored explanations (human-reviewed).
    - id: bunpou-grammar-db
      title: japanese-grammar-db (Imabi + Tae Kim aggregation)
      org: bunpou (third-party aggregator)
      url: https://github.com/bunpou/japanese-grammar-db
      license: unknown (upstream Imabi terms unclear; Tae Kim NC)
      license_url: https://github.com/bunpou/japanese-grammar-db
      accessed: "2026-10-02"
      type: grammar dataset
      redistribution: unknown
      attribution: n/a until verified
      notes: aggregation inherits upstream ambiguity; Imabi terms not
        established.
      blocker: >
        Do not use until Imabi and Tae Kim terms are individually
        verified; NC upstream makes most of it unusable anyway.
      alternative: jkindrix grammar layer; project-authored content.
    - id: jkindrix-jld
      title: japanese-language-data (unified CC-BY-SA dataset)
      org: jkindrix (aggregates JMdict, KANJIDIC2, KanjiVG, Tatoeba,
        Kanjium, Waller JLPT)
      url: https://github.com/jkindrix/japanese-language-data
      license: CC BY-SA 4.0 (aggregation layer)
      license_url: https://github.com/jkindrix/japanese-language-data
      accessed: "2026-10-02"
      type: grammar/lexicon dataset
      redistribution: derived
      attribution: per-component attribution preserved upstream;
        verify component list before shipping
      notes: >
        Convenient cross-linked source; we must still honor each
        component's terms (all verified CC BY-SA/CC0-class).
    - id: openjlpt
      title: OpenJLPT grammar/word seed datasets
      org: evanclan
      url: https://github.com/evanclan/OpenJLPT
      license: claimed open; per-file terms not yet verified
      license_url: https://github.com/evanclan/OpenJLPT
      accessed: "2026-10-02"
      type: grammar dataset
      redistribution: unknown
      attribution: n/a until verified
      notes: claims "correctly-licensed" but per-record provenance
        must be checked before any pack use.
      alternative: jkindrix-jld; project-authored grammar points.

  lexicon:
    - id: jmdict
