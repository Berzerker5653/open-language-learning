# JA-RES-001 — Authoritative Japanese source and license matrix
#
# Registry per docs/10_LICENSING_AND_PROVENANCE.md §Source registry.
# Classification vocabulary (acceptance): allowed | derived |
# reference-only | blocked | unknown.
#   allowed        — license permits bundling/redistribution in our
#                    product subject only to attribution/notice terms.
#   derived        — usable but with share-alike/attribution/derivation
#                    isolation duties (kept in the isolated data layer).
#   reference-only — may inform design/derivation but its data may not
#                    be copied into shipped packs.
#   blocked        — terms are incompatible with our distribution model;
#                    must not be used for shipped content.
#   unknown        — license/terms not established; may not ship; each
#                    entry lists an alternative or an explicit blocker.
#
# Every entry: id, title, org, url, license, license_url, accessed,
# type, redistribution, attribution, notes, alternatives (when
# unknown/blocked/reference-only).
#
# This matrix is engineering evidence for LIC-001, not a legal
# determination. Final licensing decisions remain owner-only.

meta:
  task: JA-RES-001
  matrix_version: "0.1.0"
  compiled: "2026-10-02"
  method: >
    Candidate sources verified against publisher/project license pages
    via primary URLs on the access date. Facts vs hypotheses are
    distinguished in notes. Uncertain items are classified unknown and
    carry alternatives or explicit blockers.
  distribution_context: >
    Desktop product with shipped language packs; final app/content
    license pending LIC-001 (owner-only). Share-alike dictionary data
    must stay isolated in the generated data layer so obligations are
    auditable (docs/10).

categories:
  functional_standards:
    - id: jf-standard
      title: JF Standard for Japanese-Language Education
      org: The Japan Foundation Japanese-Language Institute
      url: https://www.jfstandard.jpf.go.jp/summaryen/ja/render.do
      license: proprietary (site content); framework ideas referenced
      license_url: https://www.jfstandard.jpf.go.jp/e_index.html
      accessed: "2026-10-02"
      type: official framework
      redistribution: reference-only
      attribution: cite the JF Standard when describing level alignment
      notes: >
        Can-do/CEFR-aligned A1-C2 framework. Do not copy site or
        guidebook descriptors wholesale into packs.
      alternative: >
        Project-authored Can-do statements aligned to the framework,
        AI-drafted then human-reviewed (REVIEW-001 capacity required).
    - id: cefr
      title: CEFR (Common European Framework of Reference for Languages)
      org: Council of Europe
      url: https://www.coe.int/en/web/common-european-framework-reference-languages
      license: proprietary (Companion Volume); level names are factual
      license_url: https://www.coe.int/en/web/common-european-framework-reference-languages/terms-of-use
      accessed: "2026-10-02"
      type: official framework
      redistribution: reference-only
      attribution: cite CEFR when using A1-C2 labels
      notes: Level labels (A1..C2) are descriptive facts; descriptor
        text is copyrighted.
      alternative: project-authored descriptors; JF Standard alignment.
    - id: actfl-2024
      title: ACTFL Proficiency Guidelines 2024
      org: ACTFL
      url: https://www.actfl.org/proficiency-guidelines-overview
      license: proprietary
      license_url: https://www.actfl.org/proficiency-guidelines-overview
      accessed: "2026-10-02"
      type: official framework
      redistribution: reference-only
      attribution: cite for cross-checks only
      notes: secondary cross-check per docs/SOURCES.md; no wholesale
        reproduction.
      alternative: JF Standard as primary; project-authored rubric text.

  grammar:
