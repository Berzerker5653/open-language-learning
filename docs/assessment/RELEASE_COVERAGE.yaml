# Finite release coverage map (REVIEW-001) — the denominator for all band
# completeness claims (docs/09 §Finite-reference-band, docs/18 §Course-completeness).
#
# A band may be labeled complete only when every required objective row here
# passes the machine-verifiable gates below. Narrowing the required set is an
# owner scope decision requiring recorded rationale, never a silent edit.
#
# STATUS: on-ramp/A1 objectives are implemented (draft review state, pack
# org.openlanguage.ja-jp.reference v0.1.0). A2/B1/B2 objectives are the frozen
# target set; content is not authored. No band may be claimed complete until
# gates pass; all bands are currently partial by review state.

coverage_version: "1.0.0"
schema_version: 1
status: draft-pending-owner-approval   # flips to agreed-<date> on owner in-chat approval
language_pack: org.openlanguage.ja-jp.reference
variant: standard-japanese

frameworks:
  primary:
    name: Japan Foundation Standard "Can-do" descriptors
    edition: JF Standard for Japanese-Language Education (CEFR-aligned A1-C2;
      activity descriptors through A1-B2)
    use: functional objective wording and activity framing
  reference:
    name: CEFR Companion Volume
    edition: "2020"
    use: modality/support-condition vocabulary and level anchoring
  alignment_rationale: >
    JF Standard is the established functional framework for Japanese and is
    CEFR-aligned by its authors; CEFR CV supplies descriptor scales and
    support-condition language. Alignment is "informed by/aligned with", NOT
    an equivalence or certification claim (docs/18). Level breadth per band
    follows JF activity descriptor ranges; qualified curriculum/assessment
    reviewers must approve breadth at promotion.
  prohibited_claims: [official certification, direct framework equivalence,
    proficiency from course completion alone]

