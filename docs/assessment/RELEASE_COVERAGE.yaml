# ---------------------------------------------------------------------------
# Machine-verifiable gates (docs/09) — evaluated per claimed band
# ---------------------------------------------------------------------------
gates:
  coverage_linkage: 100% of required objectives linked to implemented
    lessons/tasks + checkpoint/transfer plans + retention checks; zero missing
    dependencies or unresolved references (langpack audit-curriculum)
  review_core: 100% of full_review_required scope (REVIEW_POLICY) has
    version-bound qualified_human records; no unresolved P0/P1
  sampling_disclosed: sampled periphery records complete and labeled
  speech_features: automatic feedback features pass docs/17 qualification
    registry or remain guided/unscored
  sources_licenses: audit-sources/audit-licenses clean for band content
promotion: band label (partial/complete) computed from gates; complete only
  when all gates pass; any significant change to required set requires
  recorded review and renewed claim assessment

claim_rules:
  - bands here are targets; current pack claims at most "A1-like coverage,
    partial (review pending)" until gates pass
  - checkpoint performance != proficiency; transfer under stated conditions only
  - sampled unreviewed practice excluded from decisive claims

exclusions_explicit:
  - kanji handwriting production as a gate for speaking bands
  - pitch-accent automatic scoring beyond SPEECH-007 qualified envelope
  - certification/equivalence claims of any kind
