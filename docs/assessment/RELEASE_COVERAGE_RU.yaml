# ---------------------------------------------------------------------------
# Machine-verifiable gates (same semantics as the ja-JP map; checked by hand,
# not by CI — see ADR-0025)
# ---------------------------------------------------------------------------
gates:
  coverage_linkage: 100% of required objectives in a claimed band link to a pack
    goal with >=1 authored unit and >=1 declared assessment (langpack
    audit-curriculum — currently 0 errors/0 warnings for ru-RU)
  assessed_modality_coverage: each required objective's claimed modalities have a
    matching assessment; where a content modality lacks one it is recorded under
    `outstanding` and the band stays partial (currently reading+writing only)
  review_core: 100% of the full-review core (REVIEW_POLICY) carries approved
    qualified-human records; sampling rules per REVIEW_POLICY — ru-RU has zero
    such records today (BLK-REVIEW-CAPACITY)
  sampling_disclosed: sampling method/seed/residual risk recorded per batch
  speech_features: scored listening/speaking only after docs/17 qualification;
    until then speech activities render guided/unscored (ADR-0017)
  sources_licenses: audit-sources and audit-licenses clean (ru-RU currently
    0/0; ТРКИ/CEFR grounded inline in frameworks.trki_cefr_reference, no text reproduced)
promotion: band label (partial/complete) computed from gates; complete only when
  all gates pass; any change to the required set requires recorded review and
  renewed claim assessment (docs/18)

claim_rules:
  - >-
    every ru-RU band is currently "partial (review pending)" at most: reading
    and writing are implemented-draft and unreviewed; listening is audio-backed
    but not assessed; speaking is not assessed
  - checkpoint performance != proficiency; transfer under stated conditions only
  - unit and activity counts are context and never a completeness argument
exclusions_explicit:
  - ТРКИ/CEFR certification or equivalence claims of any kind
  - reproduction or close paraphrase of ТРКИ test items or descriptor text
  - automatic pronunciation/speaking scoring beyond the docs/17 qualified
    envelope
