# ---------------------------------------------------------------------------
# Machine-verifiable gates (same semantics as ja-JP map)
# ---------------------------------------------------------------------------
gates:
  coverage_linkage: 100% of required objectives in a claimed band link to a
    pack goal with >=1 authored unit
  review_core: 100% of the full-review core (REVIEW_POLICY) carries approved
    qualified-human records; sampling rules per REVIEW_POLICY
  sampling_disclosed: sampling method/seed/residual risk recorded per batch
  speech_features: scored listening/speaking only after docs/17 qualification;
    until then speech activities render guided/unscored
  sources_licenses: audit-sources and audit-licenses clean at build
