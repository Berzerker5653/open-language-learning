# Finite release coverage map — ru-RU. Denominator for all band-completeness
# claims (docs/09, docs/18 §Course-completeness, ADR-0025). Modeled on the
# ja-JP map (docs/assessment/RELEASE_COVERAGE.yaml) and held to the same rigor.
#
# A band may be labeled complete only when every required objective row here
# passes the machine-verifiable gates below. Narrowing the required set is an
# owner scope decision requiring recorded rationale, never a silent edit.
#
# STATUS (re-measured against pack source 2026-10-13; measured 2026-10-12 at
# v0.3.0): pack org.openlanguage.ru-ru.reference is v0.4.0 with 60 goals
# (6 on-ramp, 9 A1, 10 A2, 13 B1, 22 B2) and 809 units, plus 240 assessment
# definitions (the 2026-10-12 note said 810 units; the tree held 809 that day
# too, so that figure was a miscount). That is NOT a completeness claim: unit
# counts are context only and may never establish band completeness (docs/18).
# All 60 objectives are now ASSESSED across all four modalities — reading,
# writing, listening and speaking (240 assessments, 60 per modality): the earlier
# reading/writing-only gap is closed at the authored level. This is still NOT a
# band-completeness claim — every assessment is `review_status: draft` with zero
# qualified-human review records (BLK-REVIEW-CAPACITY), so every band stays
# `partial (review pending)` until the review_core gate passes. Speaking/listening
# assessments render guided/unscored until docs/17 speech qualification (ADR-0017).

coverage_version: "1.0.0"
schema_version: 1
status: agreed-owner-2026-10-12   # denominator approved by owner in-chat (ADR-0025 Accepted); scopes the required set — does NOT certify content: bands stay partial until the review gates pass
variant: standard-russian

frameworks:
  primary:
    name: ТРКИ / ТБУ (Testing of Russian as a Foreign Language)
    edition: >
      State system administered by the Institute of Russian Language named after
      A.S. Pushkin and the Russian federal testing centres; component model
      Чтение (reading) / Аудирование (listening) / Лексика (vocabulary) /
      Грамматика (grammar) / Письмо (writing) / Говорение (speaking).
    use: >
      Level anchoring and the receptive/productive component model. Each ТРКИ
      level carries a published lexical and grammatical minimum; the exact
      counts and the breadth of each band are for a qualified curriculum
      reviewer to confirm at promotion, and are NOT asserted here as figures.
  reference:
    name: CEFR Companion Volume
    edition: "2020"
    use: modality/support-condition vocabulary and cross-framework anchoring
  alignment_rationale: >
    ТРКИ/ТБУ is the established functional/certification framework for Russian
    as a foreign language and is CEFR-aligned by its administering bodies, so it
    is the Russian analogue of the Japan Foundation Standard that grounds the
    ja-JP map. Alignment is "informed by / aligned with", NOT an equivalence or
    certification claim (docs/18). The pack aligns its band objectives to ТРКИ
    levels and components; it does NOT reproduce, quote or paraphrase ТРКИ test
    items or descriptor text.
  trki_cefr_reference:
    source_title: Test of Russian as a Foreign Language (ТРКИ) — level structure
    publisher: Institute of Russian Language named after A.S. Pushkin
    url: https://www.pushkin.institute/certificates/trki/
    accessed: "2026-10-12"
    mapping:   # levels as published by the administering bodies
      - {trki: "ТЭУ / Elementary", cefr: A1}
      - {trki: "ТБУ / Basic", cefr: A2}
      - {trki: "ТРКИ-I / First level", cefr: B1}
      - {trki: "ТРКИ-II / Second level", cefr: B2}
      - {trki: "ТРКИ-III / Third level", cefr: C1}
    limits:
      - ТРКИ certifies candidates who pass its components; a course does not
        confer or predict a ТРКИ result.
      - the map aligns objectives to these bands and never markets ТРКИ
        preparation, alignment or certification (docs/18 prohibited_claims)
  prohibited_claims: [official certification, direct framework equivalence,
    proficiency from course completion alone]
  provenance: >
    Framework grounding is recorded inline above (frameworks.trki_cefr_reference:
    publisher, URL, accessed date, limits). This is pack-level alignment
    metadata, NOT a per-item content source: languages/ru-RU/sources.jsonl is the
    content-source registry and every entry there must be referenced by a content
    record (audit-sources flags `unused_source`), and no pack item is derived
    from ТРКИ/CEFR text, so none cites it. No ТРКИ or CEFR text is bundled,
    mirrored or reproduced in the pack; if ТРКИ-aligned items are ever authored,
    the specific source they cite must be added to sources.jsonl and referenced.

# ---------------------------------------------------------------------------
# Required objective sets (finite) — derived 1:1 from the authored pack goal
# graph (languages/ru-RU/curriculum/goals.yaml, 60 goals). Per-band we list the
# modalities each objective is ASSESSED across and the modalities the CONTENT
# supports. Every objective is now assessed across all four modalities (reading,
# writing, listening, speaking) at review_status: draft, so the earlier
# reading/writing-only gap is closed at the authored level — pending review.
# ---------------------------------------------------------------------------
