# Finite release coverage map — ru-RU (draft, mirrors ja-JP RELEASE_COVERAGE.yaml).
#
# A band may be labeled complete only when every required objective row here
# passes the machine-verifiable gates below. Narrowing the required set is an
# owner scope decision requiring recorded rationale, never a silent edit.
#
# STATUS: proposed draft prepared 2026-10-05 by omp (ai-assisted). NOT yet
# owner-approved; the frozen denominator for ru-RU band-completeness claims
# does not exist until the owner approves this file (or a revised version).
# All rows are content_status: implemented-draft — authored and structurally
# validated, zero qualified human review records (BLK-REVIEW-CAPACITY).

coverage_version: "0.1.0-draft"
schema_version: 1
status: proposed-pending-owner-approval   # do not treat as agreed
variant: standard-russian

frameworks:
  primary:
    name: CEFR Companion Volume
    edition: "2020"
    use: functional objective wording and level anchoring
  reference:
    name: TRLN/ТРKI task formats
    edition: "reference only"
    use: activity framing sanity-check; no descriptor or exam text reproduced
  alignment_rationale: >
    There is no single canonical functional framework for Russian comparable
    to the JF Standard for Japanese; CEFR CV supplies descriptor scales and
    modality language. Alignment is "informed by/aligned with", NOT an
    equivalence or certification claim (docs/18). Qualified curriculum/
    assessment reviewers must approve breadth at promotion.
  prohibited_claims: [official certification, direct framework equivalence,
    proficiency from course completion alone]

